<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A322A">
<meta name="description" content="My RespirOutdoor : ton plan d'entraînement course à pied, préparé par ton entraîneur Respir Outdoor.">
<meta name="apple-mobile-web-app-title" content="My RespirOutdoor">
<title>My RespirOutdoor</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
/* Couleurs mesurées sur le logo Respir Outdoor fourni (pas de codes officiels) :
   vert du lettrage #3A8376, vert sombre #0A322A, gris-vert du dragon #39564E. */
:root {
  --vert: #3A8376;          /* logo : barres de graphique, filets (4,5:1 sur blanc) */
  --vert-fonce: #2E6B60;    /* vert du logo assombri : boutons, liens (6,2:1) */
  --sapin: #0A322A;         /* logo : en-tête, titres (14:1) */
  --dragon: #39564E;        /* logo : texte secondaire (8:1) */
  --vert-clair: #E4F0ED;
  --fond: #F6F8F7;
  --carte: #FFFFFF;
  --texte: #0A322A;
  --texte-2: #4A5D57;
  --bord: #CCD9D5;
  --repos: #F0F3F2;
  --alerte: #9A3412;
  --alerte-fond: #FFF4EC;
  --rayon: 10px;
  --cible: 44px;
  --nav-h: 62px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --vert: #5FB3A2; --vert-fonce: #7CC5B5; --sapin: #DDEEE9; --dragon: #A9C2BA; --vert-clair: #18332D;
    --fond: #0D1714; --carte: #14211D; --texte: #E6F0ED; --texte-2: #A9BDB6; --bord: #2B403A; --repos: #111C19;
    --alerte: #FDBA74; --alerte-fond: #2A1A10; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --vert: #5FB3A2; --vert-fonce: #7CC5B5; --sapin: #DDEEE9; --dragon: #A9C2BA; --vert-clair: #18332D;
  --fond: #0D1714; --carte: #14211D; --texte: #E6F0ED; --texte-2: #A9BDB6; --bord: #2B403A; --repos: #111C19;
  --alerte: #FDBA74; --alerte-fond: #2A1A10; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--fond); color: var(--texte); padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom)); }
a { color: var(--vert-fonce); }
h1, h2, h3 { line-height: 1.2; margin: 0 0 .5rem; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.05rem; }
.lien-evitement { position: absolute; left: -999px; }
.lien-evitement:focus { left: 8px; top: 8px; z-index: 99; background: var(--carte); padding: 8px; }
:focus-visible { outline: 3px solid var(--vert); outline-offset: 2px; }

/* En-tête */
header.app { background: #0A322A; color: #fff; padding: 8px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
header.app .logo { background: #fff; border-radius: 8px; padding: 3px 6px; height: 46px; display: flex; align-items: center; }
header.app .logo img { height: 40px; width: auto; display: block; }
header.app .titre { flex: 1 1 160px; min-width: 0; }
header.app .titre strong { display: block; font-size: 1rem; letter-spacing: .02em; }
header.app .titre span { font-size: .8rem; opacity: .85; }
header.app select { max-width: 100%; min-height: 40px; border-radius: 8px; border: 0; padding: 0 8px; font: inherit; font-size: .9rem; }
.badge-role { font-size: .75rem; background: rgba(255,255,255,.15); border-radius: 99px; padding: 3px 10px; white-space: nowrap; }

/* Navigation : barre basse sur mobile, onglets en haut sur grand écran */
nav.onglets { position: fixed; bottom: 0; left: 0; right: 0; height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
  background: var(--carte); border-top: 1px solid var(--bord); display: flex; z-index: 20; }
nav.onglets a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--texte-2); font-size: .75rem; font-weight: 600; min-width: 0; }
nav.onglets a svg { width: 22px; height: 22px; }
nav.onglets a[aria-current="page"] { color: var(--vert-fonce); box-shadow: inset 0 3px 0 var(--vert); }
@media (min-width: 900px) {
  body { padding-bottom: 0; }
  nav.onglets { position: sticky; top: 0; height: auto; border-top: 0; border-bottom: 1px solid var(--bord); justify-content: center; }
  nav.onglets a { flex: 0 0 auto; flex-direction: row; padding: 12px 20px; font-size: .9rem; gap: 8px; }
  nav.onglets a[aria-current="page"] { box-shadow: inset 0 -3px 0 var(--vert); }
}

main { max-width: 1100px; margin: 0 auto; padding: 16px; }
.carte { background: var(--carte); border: 1px solid var(--bord); border-radius: var(--rayon); padding: 14px 16px; margin-bottom: 14px; }
.grille2 { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .grille2 { grid-template-columns: 1fr 1fr; } }
.muet { color: var(--texte-2); }
.petit { font-size: .85rem; }
.ligne { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.espace { flex: 1; }

button, .bouton { font: inherit; font-weight: 600; min-height: var(--cible); padding: 0 14px; border-radius: 8px; border: 1px solid var(--vert-fonce); background: var(--vert-fonce); color: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; }
:root[data-theme="dark"] button:not(.sec):not(.discret):not(.danger), :root[data-theme="dark"] .bouton:not(.sec) { color: #0D1714; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button:not(.sec):not(.discret):not(.danger), :root:not([data-theme="light"]) .bouton:not(.sec) { color: #0D1714; } }
button.sec, .bouton.sec { background: transparent; color: var(--vert-fonce); }
button.discret { background: transparent; border-color: transparent; color: var(--vert-fonce); padding: 0 8px; }
button.danger { background: transparent; color: var(--alerte); border-color: var(--alerte); }
button:disabled { opacity: .5; cursor: not-allowed; }
input, select, textarea { font: inherit; color: var(--texte); background: var(--carte); border: 1px solid var(--bord); border-radius: 8px; padding: 8px 10px; min-height: var(--cible); width: 100%; }
textarea { min-height: 80px; resize: vertical; }
input[type="checkbox"] { width: 22px; height: 22px; min-height: 0; accent-color: var(--vert-fonce); }
label { display: block; font-size: .85rem; font-weight: 600; color: var(--texte-2); margin-bottom: 10px; }
label > input, label > select, label > textarea { margin-top: 4px; }
.duree-hms { grid-column: 1 / -1; margin: 4px 0 12px; }
.duree-hms .etiq-champ { display: block; font-size: .85rem; font-weight: 600; color: var(--texte-2); }
.hms { display: flex; gap: 10px; margin-top: 6px; }
.hms label { display: flex; align-items: center; gap: 6px; flex: 1; margin: 0; font-weight: 600; color: var(--texte-2); }
.hms input { width: 100%; min-width: 0; text-align: center; margin: 0; }
.champs { display: grid; gap: 0 12px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
fieldset { border: 1px solid var(--bord); border-radius: var(--rayon); margin: 0 0 12px; padding: 10px 12px 2px; }
fieldset[disabled] { opacity: .6; }
legend { font-weight: 700; padding: 0 6px; }

/* Fiche athlète */
.fiche h2 { margin-bottom: 2px; }
.objectif { font-weight: 700; color: var(--vert-fonce); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 12px; }
.kpi { background: var(--vert-clair); border-radius: 8px; padding: 8px 10px; }
.kpi b { display: block; font-size: 1.2rem; }
.kpi span { font-size: .8rem; color: var(--texte-2); }
.dispos { display: flex; gap: 4px; }
.dispos span { width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; border: 1px solid var(--bord); color: var(--texte-2); }
.dispos span.oui { background: var(--vert-fonce); border-color: var(--vert-fonce); color: var(--carte); }

/* Semaine */
.nav-semaine { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.nav-semaine h2 { margin: 0; flex: 1; text-align: center; min-width: 180px; }
.nav-semaine h2 small { display: block; font-size: .8rem; font-weight: 400; color: var(--texte-2); }
.ruban { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 0; justify-content: center; }
.ruban span { font-size: .78rem; font-weight: 700; letter-spacing: .04em; border-radius: 99px; padding: 3px 12px; background: var(--vert-clair); color: var(--sapin); }
.ruban span.cycle { background: transparent; border: 1px dashed var(--vert); }
.jours { display: grid; gap: 10px; }
.jour { background: var(--carte); border: 1px solid var(--bord); border-left: 5px solid var(--fam, var(--bord)); border-radius: var(--rayon); padding: 10px 12px; }
.jour.repos { background: var(--repos); }
/* Contour du jour dessiné à l'intérieur : la carte garde la même largeur que les autres */
.jour.auj { box-shadow: inset 0 0 0 2px var(--vert); }
#contenu > div > .jour { margin-bottom: 14px; }
.jour .tete { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.jour .date { font-weight: 700; min-width: 92px; }
.jour .corps { font-weight: 700; font-size: 1.02rem; }
.jour.repos .corps { font-weight: 500; color: var(--texte-2); }
.puces { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.puce { font-size: .78rem; border: 1px solid var(--bord); border-radius: 99px; padding: 2px 9px; background: var(--carte); white-space: nowrap; }
.puce.type { border-color: var(--fam, var(--bord)); font-weight: 700; }
.puce.type::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--fam, var(--bord)); margin-right: 5px; }
.consigne { margin-top: 6px; font-size: .88rem; color: var(--alerte); font-weight: 600; }
.reperes { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
.repere { font-size: .8rem; background: var(--vert-clair); border-radius: 6px; padding: 3px 8px; }
.repere b { color: var(--sapin); }
.retour { margin-top: 8px; border-top: 1px dashed var(--bord); padding-top: 8px; display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: center; font-size: .9rem; }
.retour .note { flex-basis: 100%; font-style: italic; color: var(--texte-2); white-space: pre-wrap; }
.rpe { display: inline-block; min-width: 26px; text-align: center; border-radius: 6px; padding: 0 6px; font-weight: 700; color: var(--rpe-t, #fff); background: var(--rpe, var(--dragon)); }
details.def { margin-top: 6px; font-size: .82rem; color: var(--texte-2); }
details.def summary { cursor: pointer; min-height: 28px; }
.bilan { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }

/* Tableaux */
.tableau { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { border-bottom: 1px solid var(--bord); padding: 6px 8px; text-align: left; vertical-align: top; }
th { background: var(--vert-clair); color: var(--sapin); font-weight: 700; position: sticky; top: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.cour td { background: var(--vert-clair); }
tbody tr.cliquable { cursor: pointer; }
tbody tr.cliquable:hover td { background: var(--vert-clair); }

/* Graphique */
.graph { position: relative; }
.graph svg { width: 100%; height: auto; display: block; }
.graph .axe { fill: var(--texte-2); font-size: 11px; }
.graph .grille { stroke: var(--bord); stroke-width: 1; }
.graph rect.barre { fill: var(--vert); cursor: pointer; }
.graph rect.barre.cour { fill: var(--sapin); }
.graph rect.cible { fill: transparent; cursor: pointer; }
.infobulle { position: absolute; pointer-events: none; background: var(--carte); border: 1px solid var(--bord); border-radius: 8px; padding: 6px 10px; font-size: .8rem; box-shadow: 0 4px 14px rgba(0,0,0,.12); white-space: nowrap; display: none; z-index: 5; }

/* Légende */
.fam { display: inline-block; width: 12px; height: 12px; border-radius: 3px; background: var(--fam); vertical-align: -1px; margin-right: 6px; }
dl.codes { display: grid; grid-template-columns: minmax(64px, max-content) minmax(0, 1fr); gap: 6px 14px; margin: 0; }
dl.codes dt, dl.codes dd { min-width: 0; overflow-wrap: anywhere; }
dl.codes dt { font-weight: 700; }
dl.codes dd { margin: 0; color: var(--texte-2); }
mark { background: #FDE68A; color: #000; }

/* Protos */
.proto h3 { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.proto .code { font-size: .8rem; background: var(--sapin); color: var(--fond); border-radius: 6px; padding: 2px 8px; }
.proto table td { border: 1px solid var(--bord); }

.alerte { background: var(--alerte-fond); border: 1px solid var(--alerte); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
.vide { text-align: center; padding: 30px 16px; }
.vide img { max-width: 240px; width: 70%; }

dialog { border: 0; border-radius: 14px; padding: 0; width: min(680px, calc(100vw - 24px)); max-height: calc(100vh - 32px); background: var(--carte); color: var(--texte); }
dialog::backdrop { background: rgba(5,25,20,.55); }
dialog form.boite { padding: 16px; }
dialog .pied { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; position: sticky; bottom: 0; background: var(--carte); padding-top: 10px; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 16px); background: var(--sapin); color: var(--fond); padding: 10px 16px; border-radius: 8px; display: none; z-index: 50; max-width: calc(100vw - 32px); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media print {
  nav.onglets, header.app select, .noprint, button { display: none !important; }
  body { background: #fff; padding: 0; }
  .carte, .jour { break-inside: avoid; }
}

/* ---------- Synchronisation, tableau de bord, athlète ---------- */
header.app .statut { font: inherit; font-size: .75rem; font-weight: 500; min-height: 32px; padding: 4px 10px; border-radius: 99px; border: 0; background: rgba(255,255,255,.15); color: #fff; cursor: pointer; max-width: 100%; text-align: left; }
header.app .statut.attention { background: #FDE68A; color: #3B2F00; }
body.athlete header.app .titre span { font-size: .95rem; opacity: 1; }
nav.onglets button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: none; border: 0; border-radius: 0; color: var(--texte-2); font-size: .75rem; font-weight: 600; min-width: 0; padding: 0; min-height: 0; }
nav.onglets button svg { width: 22px; height: 22px; }
nav.onglets button[aria-current="page"] { color: var(--vert-fonce); box-shadow: inset 0 3px 0 var(--vert); }
nav.onglets[hidden] { display: none; }
@media (min-width: 900px) {
  nav.onglets button { flex: 0 0 auto; flex-direction: row; padding: 12px 20px; font-size: .9rem; gap: 8px; }
  nav.onglets button[aria-current="page"] { box-shadow: inset 0 -3px 0 var(--vert); }
}
@media (max-width: 420px) { nav.onglets a, nav.onglets button { font-size: .68rem; } }
/* Barre d'onglets sur fond sapin dans les deux modes : vert clair (contraste 9,2:1), onglet actif en blanc (14:1) */
nav.onglets { background: #0A322A; border-top-color: #0A322A; border-bottom-color: #0A322A; }
:root nav.onglets button:not(.sec):not(.discret):not(.danger), :root nav.onglets a { color: #A8DCCF; }
:root nav.onglets button[aria-current="page"]:not(.sec):not(.discret):not(.danger), :root nav.onglets a[aria-current="page"] { color: #FFFFFF; box-shadow: inset 0 3px 0 #7CC5B5; }
@media (min-width: 900px) { :root nav.onglets button[aria-current="page"]:not(.sec):not(.discret):not(.danger), :root nav.onglets a[aria-current="page"] { box-shadow: inset 0 -3px 0 #7CC5B5; } }
:root[data-theme="dark"] nav.onglets button:not(.sec):not(.discret):not(.danger) { color: #A8DCCF; }
:root[data-theme="dark"] nav.onglets button[aria-current="page"]:not(.sec):not(.discret):not(.danger) { color: #FFFFFF; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) nav.onglets button:not(.sec):not(.discret):not(.danger) { color: #A8DCCF; }
  :root:not([data-theme="light"]) nav.onglets button[aria-current="page"]:not(.sec):not(.discret):not(.danger) { color: #FFFFFF; }
}
.titre-section { font-size: 1.1rem; margin: 18px 0 10px; }
.kpis2 { grid-template-columns: repeat(2, 1fr); }
@media (min-width: 760px) { .kpis2 { grid-template-columns: repeat(4, 1fr); } }
.kpi .etiq { display: block; font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--texte-2); }
.kpi .ecart { display: block; font-size: .8rem; color: var(--texte-2); }
.mot { border: 2px solid #A8DCCF; border-left-width: 5px; } /* même vert clair que les icônes des onglets */
.mot p { margin: 6px 0 0; white-space: pre-wrap; }
.compet { display: flex; gap: 14px; align-items: center; }
.compet .jx { font-size: 1.4rem; font-weight: 800; color: var(--fond); background: var(--sapin); border-radius: 10px; padding: 8px 12px; white-space: nowrap; }
ul.records { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
ul.records li { display: grid; grid-template-columns: 1fr auto; gap: 0 10px; border-bottom: 1px solid var(--bord); padding-bottom: 6px; }
ul.records li .petit { grid-column: 1 / -1; }
ul.liste { margin: 0; padding-left: 18px; }
.voyant { color: var(--alerte); font-weight: 800; }
.reaction { flex-basis: 100%; font-weight: 600; color: var(--vert-fonce); }
.lien-athlete { word-break: break-all; background: var(--vert-clair); border-radius: 8px; padding: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85rem; }
.emojis { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.emojis label { margin: 0; }
.emojis input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.emojis span { display: inline-flex; align-items: center; justify-content: center; width: 52px; height: 52px; font-size: 1.6rem; border: 2px solid var(--bord); border-radius: 12px; cursor: pointer; }
.emojis input:checked + span { border-color: var(--vert-fonce); background: var(--vert-clair); }
.emojis input:focus-visible + span { outline: 3px solid var(--vert); outline-offset: 2px; }
.echelle { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.echelle span { background: var(--rpe); color: var(--rpe-t, #000); border-radius: 8px; padding: 6px 4px; text-align: center; font-size: .7rem; font-weight: 600; min-height: 52px; display: flex; flex-direction: column; justify-content: center; }
.echelle b { font-size: 1.05rem; }

/* Barre RPE à glisser (dégradé bleu → noir) */
.barre-rpe { --rpe: var(--bord); }
.barre-rpe input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; min-height: 44px; padding: 0; border: 0; background: transparent; cursor: pointer; }
.barre-rpe input[type="range"]::-webkit-slider-runnable-track { height: 14px; border-radius: 99px; background: var(--degrade); }
.barre-rpe input[type="range"]::-moz-range-track { height: 14px; border-radius: 99px; background: var(--degrade); }
.barre-rpe input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; margin-top: -8px; border-radius: 50%; background: #fff; border: 4px solid var(--rpe); box-shadow: 0 1px 4px rgba(0,0,0,.35); }
.barre-rpe input[type="range"]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 4px solid var(--rpe); box-shadow: 0 1px 4px rgba(0,0,0,.35); }
.barre-rpe.vide input[type="range"]::-webkit-slider-thumb { border-color: var(--bord); opacity: .8; }
.barre-rpe.vide input[type="range"]::-moz-range-thumb { border-color: var(--bord); opacity: .8; }
.barre-rpe .graduations { display: flex; justify-content: space-between; padding: 0 8px; font-size: .75rem; color: var(--texte-2); }
.barre-rpe .graduations span { width: 22px; text-align: center; font-size: .85rem; }
.barre-rpe .graduations span.choisi { font-weight: 800; color: var(--texte); font-size: 1.05rem; }

/* ---------- Animation d'ouverture « Épure » (2 s) : logo seul sur fond blanc, puis fondu vers l'application ---------- */
#ouverture { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: #FFFFFF;
  animation: ouv-sortie .45s ease-in 1.55s forwards; }
#ouverture .ouv-logo { opacity: 0; transform: scale(.96); animation: ouv-logo .7s cubic-bezier(.2,.7,.2,1) .15s forwards; }
#ouverture .ouv-logo img { display: block; width: min(220px, 56vw); height: auto; }
@keyframes ouv-logo { to { opacity: 1; transform: none; } }
@keyframes ouv-sortie { to { opacity: 0; visibility: hidden; } }
@media (prefers-reduced-motion: reduce) {
  #ouverture .ouv-logo { animation-duration: .01s !important; animation-delay: 0s !important; }
  #ouverture { animation: ouv-sortie .2s ease-in .4s forwards !important; }
}
@media print { #ouverture { display: none; } }

/* ---------- Harmonisation des cartes et tableaux ---------- */
:root { --rayon: 14px; }
.carte { padding: 16px; margin-bottom: 14px; min-width: 0; box-shadow: 0 1px 3px rgba(10, 50, 42, .06); }
.carte > h2, .carte > h3 { font-size: 1.1rem; margin-bottom: .75rem; }
.grille2 { grid-template-columns: minmax(0, 1fr); gap: 0 14px; }
@media (min-width: 760px) { .grille2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tableau { overflow-x: auto; border: 1px solid var(--bord); border-radius: 10px; -webkit-overflow-scrolling: touch; }
.tableau table { font-size: .9rem; }
.tableau th, .tableau td { padding: 9px 10px; }
.tableau thead th { font-size: .8rem; letter-spacing: .02em; border-bottom: 1px solid var(--bord); }
.tableau tbody tr:last-child > * { border-bottom: 0; }
.tableau tbody tr:nth-child(even) > td, .tableau tbody tr:nth-child(even) > th { background: var(--repos); }
.kpis { gap: 8px; }
.kpi { border-radius: 10px; padding: 10px 12px; }
.kpi b { font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.valeurs { margin-top: 0; }
dl.codes { gap: 0 14px; }
dl.codes dt, dl.codes dd { padding: 7px 0; border-bottom: 1px solid var(--bord); }
dl.codes dt:last-of-type, dl.codes dd:last-of-type { border-bottom: 0; }
.echelle { gap: 8px; }
.echelle span { border-radius: 10px; min-height: 58px; font-size: .72rem; padding: 6px 4px; }
/* Tableau de bord en colonnes */
.bilan-tab { font-size: .84rem; }
.tableau table.compact { font-size: .82rem; }
.tableau table.compact th, .tableau table.compact td { padding: 8px 6px; }
.tableau table.compact th:first-child, .tableau table.compact td:first-child { padding-left: 10px; }
.tableau table.compact th:last-child, .tableau table.compact td:last-child { padding-right: 10px; }
.tableau .bilan-tab th, .tableau .bilan-tab td { padding: 8px 6px; }
.tableau .bilan-tab th:first-child { padding-left: 10px; }
.tableau .bilan-tab th:last-child, .tableau .bilan-tab td:last-child { padding-right: 10px; }
.bilan-tab th[scope="row"] { color: var(--texte-2); font-size: .78rem; position: static; white-space: nowrap; }
.bilan-tab tbody tr:nth-child(odd) > th[scope="row"] { background: transparent; }
.bilan-tab thead th small { display: block; font-weight: 500; font-size: .7rem; color: var(--texte-2); }
.bilan-tab td b, .bilan-tab td { font-weight: 700; }
.tableau .ecart { display: block; font-size: .72rem; font-weight: 500; color: var(--texte-2); }
.tableau .ecart.voyant { color: var(--alerte); font-weight: 700; }
/* Chaussures */
.jauge { height: 6px; border-radius: 3px; background: var(--bord); margin-top: 6px; overflow: hidden; max-width: 160px; }
.jauge span { display: block; height: 100%; background: var(--vert); border-radius: 3px; }
.jauge.pleine span { background: var(--alerte); }

/* Séance pas réalisée */
.pas-faite { display: inline-block; font-size: .78rem; font-weight: 700; color: #fff; background: var(--alerte); border-radius: 99px; padding: 2px 10px; white-space: nowrap; }
:root[data-theme="dark"] .pas-faite { color: #2A1A10; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pas-faite { color: #2A1A10; } }
.alerte-nf { border-left: 5px solid var(--alerte); }
ul.liste-nf { list-style: none; margin: 0; padding: 0; }
ul.liste-nf li { padding: 8px 0; border-bottom: 1px solid var(--bord); }
ul.liste-nf li:last-child { border-bottom: 0; }
ul.liste-nf .note { font-style: italic; color: var(--texte-2); margin-top: 4px; white-space: pre-wrap; }
.raisons { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.raisons label { margin: 0; }
.raisons input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.raisons span { display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border: 1px solid var(--bord); border-radius: 99px; font-weight: 600; color: var(--texte); cursor: pointer; }
.raisons input:checked + span { background: var(--vert-fonce); border-color: var(--vert-fonce); color: var(--carte); }
.raisons input:focus-visible + span { outline: 3px solid var(--vert); outline-offset: 2px; }
/* Boutons du bas des fenêtres sur téléphone : action principale sur toute la largeur, les autres côte à côte en dessous */
@media (max-width: 560px) {
  dialog .pied { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding-bottom: 4px; }
  dialog .pied > * { width: 100%; margin: 0; }
  dialog .pied > button:not(.sec):not(.danger):not(.discret) { grid-column: 1 / -1; order: -1; }
  dialog .pied:not(:has(> :nth-child(3))) > * { grid-column: 1 / -1; }
}
/* Assistant d'aide (application de l'entraîneur) */
.aide-bouton { position: fixed; z-index: 60; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px));
  border-radius: 99px; padding: 0 16px 0 12px; min-height: 46px; box-shadow: 0 6px 18px rgba(10, 50, 42, .25); }
.aide-bouton svg { width: 22px; height: 22px; }
.aide-panneau { position: fixed; z-index: 61; right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(var(--nav-h) + 72px + env(safe-area-inset-bottom, 0px));
  width: min(400px, calc(100vw - 24px)); height: min(560px, calc(100vh - var(--nav-h) - 110px)); display: flex; flex-direction: column;
  background: var(--carte); border: 1px solid var(--bord); border-radius: 16px; box-shadow: 0 18px 50px rgba(0, 0, 0, .25); overflow: hidden; }
.aide-panneau[hidden] { display: none; }
@media (min-width: 900px) { .aide-bouton { bottom: 20px; } .aide-panneau { bottom: 78px; height: min(600px, calc(100vh - 120px)); } }
.aide-tete { display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 8px 16px; background: #0A322A; color: #fff; }
.aide-tete .discret { color: #A8DCCF; min-height: 36px; }
.aide-liste { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.aide-msg { max-width: 92%; border-radius: 14px; padding: 10px 12px; font-size: .92rem; line-height: 1.45; }
.aide-msg p, .aide-msg ol, .aide-msg ul { margin: 6px 0 0; }
.aide-msg ol, .aide-msg ul { padding-left: 20px; }
.aide-msg > :first-child { margin-top: 0; }
.aide-msg.bot { background: var(--vert-clair); color: var(--texte); align-self: flex-start; border-bottom-left-radius: 4px; }
.aide-msg.moi { background: var(--vert-fonce); color: var(--carte); align-self: flex-end; border-bottom-right-radius: 4px; }
.aide-puces { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.aide-puce { min-height: 34px; padding: 4px 12px; border-radius: 99px; font-size: .82rem; font-weight: 600; background: var(--carte); color: var(--vert-fonce); border: 1px solid var(--bord); text-align: left; }
.aide-aller { font-weight: 700; }
.aide-voir { font-weight: 600; }
.aide-form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--bord); }
.aide-form input { flex: 1; min-width: 0; }
/* Messagerie */
.pastille { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #D9534F; color: #fff; font-size: .68rem; font-weight: 800; line-height: 1; }
nav.onglets a, nav.onglets button { position: relative; }
nav.onglets .pastille { position: absolute; top: 6px; left: calc(50% + 6px); }
@media (min-width: 900px) { nav.onglets .pastille { position: static; margin-left: 4px; } }
.messagerie .fil { display: flex; flex-direction: column; gap: 8px; max-height: 55vh; min-height: 160px; overflow-y: auto; padding: 4px 2px 8px; }
.bulle { max-width: 82%; border-radius: 14px; padding: 8px 12px; }
.bulle .txt { white-space: pre-wrap; overflow-wrap: anywhere; }
.bulle .quand { font-size: .72rem; opacity: .75; margin-top: 2px; }
.bulle.moi { align-self: flex-end; background: var(--vert-fonce); color: var(--carte); border-bottom-right-radius: 4px; }
.bulle.lui { align-self: flex-start; background: var(--vert-clair); color: var(--texte); border-bottom-left-radius: 4px; }
.envoi { display: flex; gap: 8px; align-items: flex-end; margin-top: 10px; border-top: 1px solid var(--bord); padding-top: 10px; }
.envoi textarea { flex: 1; min-height: 44px; resize: vertical; }
.messagerie-coach { display: grid; gap: 14px; }
@media (min-width: 900px) { .messagerie-coach { grid-template-columns: minmax(240px, 1fr) 2fr; align-items: start; } }
ul.convs { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-height: 40vh; overflow-y: auto; }
@media (min-width: 900px) { ul.convs { max-height: 65vh; } }
button.conv { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; text-align: left; background: transparent; color: var(--texte); border: 1px solid var(--bord); padding: 8px 12px; min-height: 0; font-weight: 400; }
button.conv b { font-weight: 700; }
button.conv .apercu { grid-column: 1 / -1; font-size: .82rem; color: var(--texte-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
button.conv.choisie { border-color: var(--vert); background: var(--vert-clair); }
:root[data-theme="dark"] button.conv { color: var(--texte); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button.conv { color: var(--texte); } }
.carte.nouveau { border-left: 5px solid var(--vert); }
.decalee { display: inline-block; font-size: .78rem; font-weight: 700; color: var(--carte); background: var(--vert-fonce); border-radius: 99px; padding: 2px 10px; white-space: nowrap; }
label.choix { display: flex; align-items: center; gap: 10px; flex-wrap: nowrap; font-size: 1rem; color: var(--texte); font-weight: 400; margin-bottom: 8px; }
label.choix > input[type="radio"] { width: 22px; height: 22px; min-height: 0; margin: 0; accent-color: var(--vert-fonce); }
label.choix > span { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-width: 0; }
label.choix input[type="date"] { width: auto; max-width: 100%; margin: 0; min-height: 40px; }
/* Import : choix de l'onglet du plan (un onglet par contrat ou par objectif) */
.choix-onglets label.choix { align-items: flex-start; padding: 10px 12px; border: 1px solid var(--bord); border-radius: 10px; }
.choix-onglets label.choix > input[type="radio"] { margin-top: 2px; }
.choix-onglets label.choix > span { display: block; min-width: 0; overflow-wrap: anywhere; }
.choix-onglets small { display: block; margin-top: 2px; }
/* Courses (COMP) : « médaille dorée » ; protocole pré-compétition (PROTO) en plus discret */
:root { --or-vif: #D9A21B; --or: #9A6B00; --or-fond: rgba(217, 162, 27, .16); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --or: #F0C04A; } }
:root[data-theme="dark"] { --or: #F0C04A; }
.jour.course { border: 2px solid var(--or-vif); border-left: 6px solid var(--or-vif); background: linear-gradient(135deg, var(--or-fond), rgba(217, 162, 27, 0) 65%), var(--carte); }
.jour.course .corps { color: var(--or); font-size: 1.15rem; }
.jour.course .puce.type { background: var(--or-vif); border-color: var(--or-vif); color: #1A1200; }
.jour.course .puce.type::before { content: '🏅'; background: none; width: auto; height: auto; margin-right: 4px; border-radius: 0; }
.jour.course.auj { box-shadow: inset 0 0 0 2px var(--or-vif); }
.carte.compet { border: 2px solid var(--or-vif); background: linear-gradient(135deg, var(--or-fond), rgba(217, 162, 27, 0) 65%), var(--carte); }
.carte.compet .jx { background: var(--or-vif); color: #1A1200; }
.ancien-contrat { margin: 8px 0 0; text-align: center; font-size: .85rem; font-weight: 600; color: var(--texte-2); }
/* Textes libres (notes, messages, mots du coach) : une suite sans espace (temps « 15,08/15,70/… », lien) passe à la ligne au lieu d'élargir la page */
.jour, .alerte, .carte p, .carte li, .retour .note, .mot p, ul.liste-nf .note { overflow-wrap: anywhere; }
/* Saisie : discipline (jour de repos) et champs sans objet pour cette discipline */
fieldset.disciplines { border: 0; padding: 0; margin: 0 0 12px; min-width: 0; }
fieldset.disciplines legend { padding: 0; margin-bottom: 8px; font-weight: 600; }
[data-champ][hidden] { display: none !important; }
.retour .activite { font-weight: 700; color: var(--vert-fonce); }
/* Activités en plus de la séance du jour */
ul.extras { list-style: none; margin: 10px 0 0; padding: 10px 0 0; border-top: 1px dashed var(--bord); display: grid; gap: 8px; }
ul.extras li { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
ul.extras .activite { font-weight: 700; color: var(--vert-fonce); }
ul.extras .mesures { flex: 1 1 auto; min-width: 0; }
ul.extras .note { flex-basis: 100%; font-style: italic; color: var(--texte-2); }
ul.extras li > button { margin-left: auto; }
/* Fenêtres de saisie (séance, autre activité) : sous-titre, disciplines en grille, champs sur deux colonnes */
form.saisie h2 { margin-bottom: 2px; }
form.saisie .sous-titre { margin: 0 0 16px; color: var(--texte-2); font-size: .95rem; }
form.saisie .sous-titre b { color: var(--texte); font-weight: 600; }
form.saisie fieldset.disciplines legend, form.saisie fieldset.ressenti legend { font-size: .85rem; font-weight: 600; color: var(--texte-2); padding: 0; margin-bottom: 8px; }
form.saisie fieldset.disciplines .raisons { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 0; }
form.saisie fieldset.disciplines .raisons span { display: flex; justify-content: center; text-align: center; width: 100%; min-height: 44px; padding: 6px 10px; border-radius: 12px; font-weight: 600; line-height: 1.2; }
@media (min-width: 520px) { form.saisie fieldset.disciplines .raisons { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
form.saisie .champs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
form.saisie .duree-hms { margin: 0 0 10px; }
form.saisie .hms { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
form.saisie .hms label { position: relative; display: block; }
form.saisie .hms input { text-align: right; padding-right: 40px; }
form.saisie .hms label span { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; font-weight: 600; color: var(--texte-2); }
form.saisie fieldset.ressenti { position: relative; border: 0; padding: 0; margin: 4px 0 12px; min-width: 0; }
form.saisie .rpe-valeur { position: absolute; right: 0; top: 0; display: flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--texte-2); }
.rpe-valeur:empty { display: none; }
.barre-rpe .rpe-valeur { display: none; }
form.saisie .barre-rpe .rpe-valeur { display: flex; }
form.saisie fieldset.ressenti legend { float: left; width: 100%; }
form.saisie fieldset.ressenti .barre-rpe { clear: both; }
/* Barre RPE sans valeur : ne pas reprendre le style des écrans vides (.vide) ; « Effacer » masqué tant que rien n'est noté */
.barre-rpe.vide { padding: 0; text-align: inherit; }
.barre-rpe [hidden] { display: none !important; }
/* Aide : bouton dans l'en-tête (plus de bouton flottant sur le contenu) ; panneau par-dessus l'écran */
header.app .aide-entete { position: static; flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px 0 10px; border: 0; border-radius: 99px;
  background: rgba(255, 255, 255, .15); color: #fff; font-size: .85rem; font-weight: 600; box-shadow: none; }
header.app .aide-entete svg { width: 18px; height: 18px; }
header.app .aide-entete[aria-expanded="true"] { background: #A8DCCF; color: #0A322A; }
@media (max-width: 899px) { .aide-panneau { top: calc(12px + env(safe-area-inset-top, 0px)); bottom: calc(var(--nav-h) + 12px + env(safe-area-inset-bottom, 0px)); height: auto; } }
@media (min-width: 900px) { .aide-panneau { top: 84px; bottom: auto; } }
body:not(.athlete) header.app .titre { flex-basis: 0; } /* coach : bouton Aide sur la ligne du titre */
@media (max-width: 380px) { header.app .aide-entete .aide-txt { display: none; } header.app .aide-entete { padding: 0 9px; } }
/* Mes chaussures : liste des paires, paires retirées repliées, formulaire à la demande */
ul.paires { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 8px; }
li.paire { display: flex; align-items: center; gap: 10px; padding: 12px 8px 12px 14px; border: 1px solid var(--bord); border-radius: 12px; background: var(--carte); }
li.paire .paire-info { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
li.paire .paire-km { margin-top: 2px; font-size: .9rem; }
li.paire .jauge { max-width: none; }
li.paire.retiree { opacity: .7; }
.etiquette { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 99px; background: var(--vert-clair); color: var(--sapin); font-size: .72rem; font-weight: 700; vertical-align: 2px; }
details.retirees { margin: 0 0 12px; }
details.retirees summary { cursor: pointer; font-weight: 600; color: var(--texte-2); margin-bottom: 8px; }
button.plein { width: 100%; }
form.chaussures h3 { margin: 4px 0 12px; }
form.chaussures label.choix { font-size: .95rem; }
li.paire .paire-nom { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
li.paire .etiquette { margin-left: 0; vertical-align: 0; }
li.paire .a-changer { margin-left: 8px; white-space: nowrap; font-weight: 700; color: var(--alerte); }
/* Saisie : menu des chaussures sur toute la largeur ; terrain affiché sur la carte du jour */
form.saisie .champs label.large { grid-column: 1 / -1; }
.retour .terrain { padding: 1px 10px; border: 1px solid var(--bord); border-radius: 99px; font-size: .85rem; color: var(--texte-2); }
form.saisie .champs { align-items: end; } /* cases alignées même si un libellé passe sur deux lignes */
.titre-groupe { margin: 18px 4px 10px; font-size: .95rem; color: var(--texte-2); }
.proto h3 .famille-proto { margin-left: 8px; padding: 1px 8px; border: 1px solid var(--bord); border-radius: 99px; font-size: .72rem; font-weight: 600; color: var(--texte-2); vertical-align: 2px; white-space: nowrap; }
/* Ma VMA (athlète) : carte rouge, VMA en grand sur toute la largeur */
:root { --rouge: #B42318; --rouge-fond: #FDECEA; }
:root[data-theme="dark"] { --rouge: #F4877C; --rouge-fond: #2E1715; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --rouge: #F4877C; --rouge-fond: #2E1715; } }
.ma-vma { border-left: 5px solid var(--rouge); }
.ma-vma h2 { color: var(--rouge); }
.ma-vma .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.ma-vma .kpi { background: var(--rouge-fond); }
.ma-vma .kpi:first-child { grid-column: 1 / -1; }
.ma-vma .kpi:first-child b { font-size: 1.6rem; color: var(--rouge); }
/* Records (résultats saisis par l'entraîneur) : choix de la distance, courbe, indicateurs */
.seg-rp { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 8px; }
.seg-rp button { flex: 1 1 auto; min-height: 38px; padding: 4px 10px; font-size: .88rem; }
/* Cinq distances : trois puis deux boutons de même largeur par ligne */
.seg-rp.cinq { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); }
.seg-rp.cinq button { grid-column: span 2; }
.seg-rp.cinq button:nth-child(n+4) { grid-column: span 3; }
.courbe-rp { margin: 2px -4px 0; }
.courbe-rp svg { display: block; width: 100%; height: auto; overflow: visible; }
.courbe-rp .axe { fill: var(--texte-2); font-size: 11px; }
.courbe-rp .grille { stroke: var(--bord); stroke-width: 1; }
.courbe-rp path.record { fill: none; stroke: var(--vert); stroke-width: 2.5; stroke-linejoin: round; }
.courbe-rp polyline.suite { fill: none; stroke: var(--texte-2); stroke-width: 1; stroke-dasharray: 3 3; opacity: .6; }
.courbe-rp circle { stroke-width: 2; }
.courbe-rp circle.rp { fill: var(--rouge); stroke: var(--rouge); }
.courbe-rp circle.rec { fill: var(--vert); stroke: var(--vert); }
.courbe-rp circle.autre { fill: var(--carte); stroke: var(--texte-2); }
.courbe-rp text.val { fill: var(--texte); font-size: 11px; font-weight: 600; }
.courbe-rp text.val.rp { fill: var(--rouge); font-size: 12.5px; font-weight: 800; }
.legende-rp { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 6px 0 2px; }
.legende-rp span { display: inline-flex; align-items: center; gap: 6px; }
.legende-rp .pt { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--texte-2); background: var(--carte); }
.legende-rp .pt.rec { background: var(--vert); border-color: var(--vert); }
.legende-rp .pt.rp { background: var(--rouge); border-color: var(--rouge); }
.legende-rp .trait { display: inline-block; width: 18px; border-top: 2.5px solid var(--vert); }
.records .ecart.gain, .kpi.gain b { color: var(--vert-fonce); }
.records .ecart.gain { font-weight: 700; }
.kpi.rouge { background: var(--rouge-fond); }
.kpi.rouge b { color: var(--rouge); }
.records .etiquette.rp { background: var(--rouge); color: var(--carte); margin-left: 6px; vertical-align: 2px; }
.records td button.discret { display: block; min-height: 32px; padding: 2px 0; margin-top: 2px; }

<script id="core">

  var CLES_LOCALES = ['code', 'motCoach'];

  // Libellés et couleurs relevés sur cette image ; les niveaux sans libellé restent sans libellé.
  var ECHELLE_RPE = { 1: 'Très facile', 2: 'Facile', 4: 'Modéré', 7: 'Difficile', 9: 'Très difficile', 10: 'Effort maximal' };
  // Dégradé de la barre RPE (couleurs relevées sur l'image fournie) : bleu, cyan, vert, jaune, orange, rouge.
  // Niveau n placé à (n − 1) / 9 du dégradé ; les niveaux entre deux couleurs sont interpolés.
  var DEGRADE_RPE = ['#4879C6', '#63C6DD', '#60C462', '#FECF63', '#F2804A', '#C54135'];
  function couleurDegrade(t) {

-15% MAX — TRAVAIL DE RENFORCEMENT MUSCULAIRE (PUISSANCE) ET TECHNIQUE SPECIFIQUE (BÂTONS OU COTE AVEC MAINS SUR CUISSES)","famille":"Côtes"},{"code":"EXC","desc":"TRAVAIL EXCENTRIQUE (DESCENTE) VIGILANCE SUR L'ECHAUFFEMENT EN PROGRESSIF ET PPS AVANT SEANCE","famille":"Côtes"},{"code":"CON/EXC","desc":"TRAVAIL CONCENCTRIQUE (COTE) PUIS EXCENTRIQUE (DESCENTE)","famille":"Côtes"},{"code":"SPRINT","desc":"SPRINT (COURT OU LONG) EN COTE","famille":"Côtes"},{"code":"NAV","desc":"SEANCE EN NAVETTE - Trouver un spot spécifique (type côte …) et travailler en aller retour","famille":"Côtes"},{"code":"PYR","desc":"SEANCE PYRAMIDALE - COTE/DESC/PLAT OU COTE/PLAT/DESC OU DESC/COTE/PLAT …","famille":"Côtes"},{"code":"MYO","desc":"SEANCE MYO CROSS MAX - SOLLICITER DAVANTAGE LES FIBRES MUSCULAIRES","famille":"Côtes"},{"code":"SPE10","desc":"ALLURE SPECFIQUE 10KM","famille":"Spécifique / allures"},{"code":"SPE1/2","desc":"ALLURE SPECFIQUE SEMI MARATHON","famille":"Spécifique / allures"},{"code":"SPE MAR","desc":"ALLURE SPECIFIQUE MARATHON","famille":"Spécifique / allures"},{"code":"SPE V","desc":"ALLURE SPECIFIQUE AVEC VARIATIONS D'ALLURES","famille":"Spécifique / allures"},{"code":"PF","desc":"SEANCE DE PRE-FATIGUE","famille":"Spécifique / allures"},{"code":"ALL V","desc":"ALLURES VARIEES","famille":"Spécifique / allures"},{"code":"TEMPO","desc":"TRAVAIL DE RYTHME SELON ZONE D'ALLURES","famille":"Spécifique / allures"},{"code":"SV","desc":"SEANCE VARIEE","famille":"Divers"},{"code":"AUTO","desc":"SEANCE D'AUTONOMIE — GESTION DES DIVERS CRITERES DE SEANCES (TERRAIN/ALLURES/DUREE D'EFFORT et RECUP…) SELON ENVIES ET SENSATIONS","famille":"Divers"},{"code":"RENFO","desc":"RENFORCEMENT MUSCULAIRE","famille":"Renfo"},{"code":"PPG","desc":"PREPARATION PHYSIQUE GENERALE","famille":"Renfo"},{"code":"PPS","desc":"PREPARATION PHYSIQUE SPECIFIQUE","famille":"Renfo"},{"code":"RSP","desc":"TRAVAIL RESPIRATOIRE (YOGA/5 TIBETAINS/ COHERENCE CARDIAQUE/GESTION MENTALE...)","famille":"Respiration"},{"code":"COCA","desc":"COHERENCE CARDIAQUE","famille":"Respiration"},{"code":"5T","desc":"5 TIBETAINS","famille":"Respiration"}]},"protos":[]};
</script>
<script>
/* ======================================================================
   Briques communes aux deux applications (entraîneur et athlète) :
   stockage local, service en ligne, rendu du plan, légende, allures, protos.
   ====================================================================== */
var UI = (function () {
  'use strict';
  var C = Core;
  var FAMILLES = {
    'Aérobie': '#3A8376', 'Récupérations': '#7AA59C', 'VMA': '#B5443A', 'Fartlek': '#C2702E', 'Côtes': '#8A5A2B',
    'Spécifique / allures': '#6B4FA0', 'Divers': '#5B6B73', 'Renfo': '#3D5A80', 'Respiration': '#4E8FB0', 'Compétition': '#D9A21B'
  };
  var REACTIONS = ['👍', '💪', '🔥', '👏', '❤️', '😮'];
  var ctx = { legende: function () { return null; }, protos: function () { return []; } };

  /* ---------- Utilitaires ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(sel, el) { return (el || document).querySelector(sel); }
  function $$(sel, el) { return Array.prototype.slice.call((el || document).querySelectorAll(sel)); }
  function toast(t) { var x = $('#toast'); x.textContent = t; x.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { x.style.display = 'none'; }, 3500); }
  function auj() { return C.todayParis(); }
  function maintenant() { return new Date().toISOString(); }
  function nomComplet(a) { return [a.prenom, a.nom].filter(Boolean).join(' ') || 'Athlète sans nom'; }
  function prenom(a) { var p = C.texte(a.prenom); return p ? p.charAt(0).toUpperCase() + p.slice(1).toLowerCase() : ''; }
  function famille(code) {
    if (C.normCode(code) === 'COMP' || C.normCode(code) === 'PROTO') return 'Compétition';
    var r = C.chercherCode((ctx.legende() || {}).types, code);
    return r && r.entree.famille ? r.entree.famille : null;
  }
  // Famille ajoutée par l'entraîneur (ex. Marche nordique) : couleur stable tirée de son nom
  var PALETTE_FAM = ['#2F7D5C', '#9C4F96', '#A0522D', '#2E6F95', '#7B6D2A', '#B0476B'];
  function couleurNouvelle(f) { var h = 0; for (var i = 0; i < f.length; i++) h = (h * 31 + f.charCodeAt(i)) >>> 0; return PALETTE_FAM[h % PALETTE_FAM.length]; }
  function couleurFam(code) { var f = famille(code); return f ? FAMILLES[f] || couleurNouvelle(f) : null; }
  function minutes(v) { var t = C.texte(v); return /^\d+([.,]\d+)?$/.test(t) ? t + ' min' : t; }
  function badgeRPE(v) {
    var l = C.libelleRPE(v);
    return '<span class="rpe"' + (l ? ' style="--rpe:' + l.couleur + ';--rpe-t:' + l.texte + '"' : '') + '>' + C.nombreFR(v, 1) + '</span>' + (l && l.libelle ? ' <span class="petit muet">' + esc(l.libelle) + '</span>' : '');
  }
  function jourCourt(iso) { return C.JOURS_LONGS[C.dayOfWeek(iso)].slice(0, 3) + '. ' + C.formatDateFR(iso, true); }
  function semaineDe(a, iso) { return a.debut ? C.numSemaine(a.debut, iso) : null; }
  function lundiDe(a, n) { return C.lundiSemaine(a.debut, n); }
  // Semaines antérieures au contrat en cours (n < 1) : numérotées dans le contrat archivé qui les couvre
  function nomSemaine(a, n) {
    if (n >= 1) return { nom: 'S' + n, info: (a.semaines || {})[n] || {}, contrat: null };
    var lundi = lundiDe(a, n), c = C.contratDe(a, lundi);
    if (!c) return { nom: 'Avant S1', info: {}, contrat: null };
    var k = C.numSemaine(c.debut, lundi);
    return { nom: 'S' + k, info: (c.semaines || {})[k] || {}, contrat: c };
  }
  // Première semaine consultable : S1, ou plus tôt s'il reste des séances d'un contrat précédent
  function semaineMin(a) {
    var dates = Object.keys(a.jours || {}).sort(), s = dates.length ? semaineDe(a, dates[0]) : null;
    return C.isNum(s) && s < 1 ? s : 1;
  }
  function ilYa(iso) {
    if (!iso) return 'jamais';
    var s = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
    if (!isFinite(s)) return '—';
    if (s < 60) return 'à l\'instant';
    if (s < 3600) return 'il y a ' + Math.round(s / 60) + ' min';
    if (s < 86400) return 'il y a ' + Math.round(s / 3600) + ' h';
    return 'le ' + C.formatDateFR(C.todayParis(new Date(iso)));
  }
  function ecart(v, prec, format) {
    var d = v - prec;
    if (!d) return '<span class="ecart">= période préc.</span>';
    return '<span class="ecart">' + (d > 0 ? '+' : '−') + format(Math.abs(d)) + '</span>';
  }

  /* ---------- Stockage local : IndexedDB, repli localStorage puis mémoire ---------- */
  function creerStore(nom) {
    var db = null, api = { mode: null };
    function ouvrir() {
      return new Promise(function (ok, ko) {
        if (!window.indexedDB) return ko(new Error('IndexedDB indisponible'));
        var r = indexedDB.open(nom, 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
        r.onsuccess = function () { ok(r.result); };
        r.onerror = function () { ko(r.error); };
      });
    }
    api.charger = function () {
      return ouvrir().then(function (d) {
        db = d; api.mode = 'IndexedDB';
        return new Promise(function (ok, ko) { var q = db.transaction('kv').objectStore('kv').get('etat'); q.onsuccess = function () { ok(q.result || null); }; q.onerror = function () { ko(q.error); }; });
      }).catch(function () {
        try { api.mode = 'localStorage'; var b = localStorage.getItem(nom); return b ? JSON.parse(b) : null; }
        catch (e) { api.mode = 'mémoire (non enregistré)'; return null; }
      });
    };
    api.enregistrer = function (etat) {
      if (api.mode === 'IndexedDB') return new Promise(function (ok, ko) {
        var t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(JSON.parse(JSON.stringify(etat)), 'etat');
        t.oncomplete = function () { ok(); }; t.onerror = function () { ko(t.error); };
      });
      if (api.mode === 'localStorage') { try { localStorage.setItem(nom, JSON.stringify(etat)); } catch (e) { return Promise.reject(e); } }
      return Promise.resolve();
    };
    return api;
  }

  /* ---------- Service en ligne (script Google de l'entraîneur) ---------- */
  // Adresse du service : fichier config.json publié avec l'application (modifiable dans les réglages entraîneur)
  function chargerConfig(chemin) {
    return fetch(chemin, { cache: 'no-cache' }).then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; });
  }
  // Requête « simple » (texte brut) : pas de requête préalable CORS, acceptée par Google Apps Script
  function appelService(url, corps) {
    if (!url) return Promise.reject(new Error('service en ligne non configuré'));
    return fetch(url, { method: 'POST', body: JSON.stringify(corps), redirect: 'follow' })
      .then(function (r) { if (!r.ok) throw new Error('service injoignable (' + r.status + ')'); return r.json(); })
      .then(function (d) { if (!d || !d.ok) throw new Error((d && d.erreur) || 'réponse inattendue du service'); return d; });
  }

  /* ---------- Carte d'un jour ---------- */
  // Allure selon la discipline : min/km (course, marche), km/h (vélo), min/100 m (natation), rien (renforcement)
  function texteAllure(type, j) {
    if (!C.isNum(j.km) || !C.isNum(j.dureeSec) || j.km <= 0 || j.dureeSec <= 0) return '';
    if (type === 'kmh') return C.nombreFR(j.km / (j.dureeSec / 3600), 1) + ' km/h';
    if (type === '100m') { var s = Math.round(j.dureeSec / (j.km * 10)); return Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2) + ' /100 m'; }
    if (type === 'km') { var a = C.allureMoyenne(j.dureeSec, j.km); return a ? C.formatAllure(a) : ''; }
    return '';
  }
  // opts.role : 'coach' ou 'athlete'
  function carteJour(a, date, j, aj, opts) {
    var lg = ctx.legende() || {}, role = opts.role;
    var repos = C.estRepos(j), vide = !C.aContenuCoach(j), coul = couleurFam(j.type);
    var lp = C.chercherCode(lg.profils, j.profil), lt = C.chercherCode(lg.types, j.type);
    var rep = C.reperesSeance(j, { vma: a.vma, zones: a.zones, allures: a.allures });
    var act = C.activite(j), allure = texteAllure(act ? act.activite.allure : 'km', j);
    var tc = C.normCode(j.type), h = '<article class="jour' + (repos || vide ? ' repos' : '') + (date === aj ? ' auj' : '') + (tc === 'COMP' ? ' course' : tc === 'PROTO' ? ' proto' : '') + '"' + (coul ? ' style="--fam:' + coul + '"' : '') + ' id="j-' + date + '">';
    h += '<div class="tete"><span class="date">' + (date === aj ? 'Aujourd\'hui' : jourCourt(date)) + '</span><span class="corps">' + (vide ? '<span class="muet">' + (role === 'athlete' ? 'Pas de séance prévue' : '—') + '</span>' : esc(j.corps || '')) + '</span></div>';
    var puces = [];
    if (j.eveil) puces.push('<span class="puce" title="Échauffement / éveil musculaire">Éveil ' + esc(minutes(j.eveil)) + '</span>');
    if (j.educ) puces.push('<span class="puce" title="Éducatifs / gammes athlétiques">Éduc ' + esc(minutes(j.educ)) + '</span>');
    if (j.rac) puces.push('<span class="puce" title="Retour au calme">RAC ' + esc(minutes(j.rac)) + '</span>');
    if (j.profil) puces.push('<span class="puce" title="Profil">' + esc(j.profil) + '</span>');
    if (j.type) puces.push('<span class="puce type" title="Type' + (famille(j.type) ? ' · ' + esc(famille(j.type)) : '') + '">' + esc(j.type) + '</span>');
    if (puces.length) h += '<div class="puces">' + puces.join('') + '</div>';
    if (j.consignes) h += '<div class="consigne">⚑ ' + esc(j.consignes) + '</div>';
    if (rep.length) h += '<div class="reperes">' + rep.map(function (r) { return '<span class="repere"><b>' + esc(r.libelle) + '</b> · ' + esc(r.detail) + '</span>'; }).join('') + '</div>';
    if (lp || lt) {
      h += '<details class="def"><summary>Définitions</summary>' +
        (lt ? '<div><b>' + esc(lt.entree.code) + '</b>' + (lt.variante ? ' (variante « ' + esc(j.type) + ' »)' : '') + ' : ' + esc(lt.entree.desc) + '</div>' : '') +
        (lp ? '<div><b>' + esc(lp.entree.code) + '</b> : ' + esc(lp.entree.desc) + '</div>' : '') + '</details>';
    }
    var aRet = C.aRetour(j), passe = date <= aj, nf = C.nonRealisee(j), dc = C.decalee(j), fl = C.faiteLe(j);
    if (aRet || (!repos && !vide)) {
      h += '<div class="retour">';
      if (nf) h += '<span class="pas-faite">Pas réalisée</span>' + (nf.raison ? '<span class="muet">' + esc(nf.raison) + '</span>' : '');
      else if (dc) h += '<span class="decalee">Décalée au ' + esc(jourCourt(dc.au)) + '</span>' + (dc.raison ? '<span class="muet">' + esc(dc.raison) + '</span>' : '');
      else if (aRet) {
        if (fl) h += '<span class="muet">Faite le ' + esc(jourCourt(fl.le)) + '</span>';
        if (act) h += '<span class="activite">' + esc(act.activite.nom) + '</span>';
        h += (C.isNum(j.km) ? '<span><b>' + C.nombreFR(j.km, 2) + '</b> km</span>' : '') +
          (C.isNum(j.dureeSec) ? '<span><b>' + C.formatDuree(j.dureeSec) + '</b></span>' : '') +
          (allure ? '<span>' + allure + '</span>' : '') +
          (C.isNum(j.dplus) ? '<span>D+ ' + Math.round(j.dplus) + ' m</span>' : '') +
          (C.isNum(j.fc) ? '<span>FC moy. <b>' + Math.round(j.fc) + '</b> bpm</span>' : '') +
          (C.isNum(j.rpe) ? '<span>RPE ' + badgeRPE(j.rpe) + '</span>' : '') +
          (C.terrain(j) ? '<span class="terrain">' + esc(C.terrain(j)) + '</span>' : '');
      } else h += '<span class="muet petit">' + (role === 'athlete' ? (passe ? 'Pas encore saisie' : 'À venir') : 'Pas encore de retour') + '</span>';
      h += '<span class="espace"></span>';
      if (role === 'coach') {
        if (aRet) h += '<button class="discret noprint" data-act="reagir" data-date="' + date + '">' + (j.reaction ? 'Ma réaction' : 'Réagir') + '</button>';
        h += '<button class="discret noprint" data-act="editJour" data-date="' + date + '">Modifier</button>';
      } else if (passe || aRet) {
        if (nf || dc) h += '<button class="discret noprint" data-act="pasFaite" data-date="' + date + '">Modifier</button><button class="discret noprint" data-act="saisir" data-date="' + date + '">' + (dc ? 'Saisir ma séance' : 'Je l\'ai faite') + '</button>';
        else {
          if (!aRet && C.estPrevue(j)) h += '<button class="discret noprint" data-act="pasFaite" data-date="' + date + '">Pas réalisée</button>';
          h += '<button class="discret noprint" data-act="saisir" data-date="' + date + '">' + (aRet ? 'Modifier ma saisie' : 'Saisir ma séance') + '</button>';
        }
      }
      var note = nf ? nf.message : dc ? dc.message : fl ? fl.notes : act ? act.notes : C.notesPrincipales(j.notes);
      if (C.texte(note)) h += '<div class="note">« ' + esc(note) + ' »</div>';
      if (j.reaction) h += '<div class="reaction">' + (role === 'coach' ? 'Ta réaction' : 'Ton entraîneur') + ' : ' + esc(j.reaction) + '</div>';
      h += '</div>';
    }
    h += htmlExtras(j, date, role, passe, aRet || (!repos && !vide));
    if (!aRet && (repos || vide)) {
      if (role === 'coach') {
        h += '<div class="ligne noprint" style="justify-content:flex-end"><button class="discret" data-act="editJour" data-date="' + date + '">' + (vide ? 'Ajouter une séance' : 'Modifier') + '</button></div>';
      } else if (passe) {
        h += '<div class="ligne noprint" style="justify-content:flex-end"><button class="discret" data-act="saisir" data-date="' + date + '">Ajouter une sortie</button></div>';
      }
    }
    return h + '</article>';
  }

  // Activités en plus de la séance du jour (ex. vélo l'après-midi) ; l'athlète en ajoute une sur un jour passé ou aujourd'hui
  function htmlExtras(j, date, role, passe, ajout) {
    var ex = C.extras(j), h = '';
    if (ex.length) h += '<ul class="extras">' + ex.map(function (x, i) {
      var mes = [C.isNum(x.km) ? '<b>' + C.nombreFR(x.km, 2) + '</b> km' : '', C.isNum(x.dureeSec) ? '<b>' + C.formatDuree(x.dureeSec) + '</b>' : '', texteAllure(x.activite.allure, x),
        C.isNum(x.dplus) ? 'D+ ' + Math.round(x.dplus) + ' m' : '', C.isNum(x.fc) ? 'FC moy. ' + Math.round(x.fc) + ' bpm' : '', C.isNum(x.rpe) ? 'RPE ' + badgeRPE(x.rpe) : ''].filter(Boolean);
      return '<li><span class="activite">+ ' + esc(x.activite.nom) + '</span><span class="mesures">' + mes.join('<span class="sep"> · </span>') + '</span>' +
        (role === 'athlete' ? '<button class="discret noprint" data-act="extra" data-date="' + date + '" data-i="' + i + '">Modifier</button>' : '') +
        (C.texte(x.note) ? '<div class="note">« ' + esc(x.note) + ' »</div>' : '') + '</li>';
    }).join('') + '</ul>';
    if (role === 'athlete' && passe && ajout) h += '<div class="ligne noprint" style="justify-content:flex-end"><button class="discret" data-act="extra" data-date="' + date + '">+ Autre activité</button></div>';
    return h;
  }

  /* ---------- Fiche (en-tête du plan) ---------- */

    boite.innerHTML = h; boite.showModal();
    var f = $('form', boite);
    f.elements.au.onfocus = f.elements.au.onchange = function () { f.querySelector('input[name="quoi"][value="decale"]').checked = true; };
    $('[data-x="annuler"]', f).onclick = function () { boite.close(); };
    var an = $('[data-x="annulerNf"]', f);
    if (an) an.onclick = function () {
      var n = Object.assign({}, j); C.CHAMPS_ATHLETE.forEach(function (k) { delete n[k]; });
      enregistrer(date, n, 'Séance remise à saisir', undefined, ''); boite.close();
    };
    f.onsubmit = function (ev) {
      ev.preventDefault();
      var d = new FormData(f), n = Object.assign({}, j), decale = d.get('quoi') === 'decale', jour = String(d.get('au') || '');
      if (decale && !(jour >= min && jour <= max)) { var e = $('#erreurNf', f); e.hidden = false; e.textContent = 'Choisis une date entre le ' + C.formatDateFR(min) + ' et le ' + C.formatDateFR(max) + '.'; return; }
      C.CHAMPS_ATHLETE.forEach(function (k) { delete n[k]; });
      n.notes = decale ? C.noteDecalee(jour, d.get('raison') || '', d.get('message') || '') : C.noteNonRealisee(d.get('raison') || '', d.get('message') || '');
      delete chaussures().parDate[date];
      enregistrer(date, n, decale ? 'Séance décalée au ' + UI.jourCourt(jour) : 'Envoyé à ton entraîneur', undefined, ''); boite.close();
    };
  }
  // Séances décalées à aujourd'hui (ou à un jour déjà passé) et pas encore saisies
  function carteDecalees() {
    var a = A.athlete, aj = auj(), l = Object.keys(a.jours || {}).filter(function (d) { var x = C.decalee(a.jours[d]); return x && x.au <= aj; }).sort();
    if (!l.length) return '';
    return '<section class="carte nouveau"><h3>Séance' + (l.length > 1 ? 's' : '') + ' décalée' + (l.length > 1 ? 's' : '') + ' à faire</h3><ul class="liste-nf">' + l.map(function (d) {
      var j = a.jours[d], x = C.decalee(j);
      return '<li><div class="ligne"><div class="espace"><b>' + esc(j.corps || 'Séance') + '</b><div class="petit muet">Prévue ' + esc(UI.jourCourt(d)) + ' · décalée au ' + esc(UI.jourCourt(x.au)) + '</div></div><button data-act="saisir" data-date="' + d + '">Saisir</button></div></li>';
    }).join('') + '</ul></section>';
  }
  function saisir(date) {
    var a = A.athlete, j = a.jours[date] || {}, aj = auj();
    // Séance décalée ou déjà faite un autre jour : on demande la date réelle, gardée dans la note
    var dc = C.decalee(j), fl = C.faiteLe(j), autreJour = dc || fl, le = fl ? fl.le : (dc && dc.au <= aj ? dc.au : aj);
    if (C.nonRealisee(j) || dc) j = Object.assign({}, j, { notes: '' }); // saisir la séance finalement faite remplace « pas réalisée » ou « décalée »
    else if (fl) j = Object.assign({}, j, { notes: fl.notes });
    // Jour de repos ou sans séance prévue : l'athlète choisit sa discipline (course à pied par défaut)
    var choixAct = C.estRepos(j) || !C.aContenuCoach(j), actJ = C.activite(j), codeAct = actJ ? actJ.activite.code : 'course';
    if (actJ) j = Object.assign({}, j, { notes: actJ.notes });
    j = Object.assign({}, j, { notes: C.notesPrincipales(j.notes) }); // les activités en plus se modifient à part
    var aDuree = C.isNum(j.dureeSec) && j.dureeSec > 0, ds = aDuree ? Math.round(j.dureeSec) : 0;
    var h = '<form class="boite saisie"><h2>' + (C.aRetour(a.jours[date]) ? 'Modifier ma séance' : 'Ma séance') + '</h2>' +
      '<p class="sous-titre">' + C.JOURS_LONGS[C.dayOfWeek(date)] + ' ' + C.formatDateFR(date).slice(0, 5) + (j.corps ? ' · prévu : <b>' + esc(j.corps) + '</b>' : '') + '</p>' +
      (choixAct ? '<fieldset class="disciplines"><legend>Discipline</legend><div class="raisons">' + C.ACTIVITES.map(function (x) {
        return '<label><input type="radio" name="activite" value="' + x.code + '"' + (x.code === codeAct ? ' checked' : '') + '><span>' + esc(x.court || x.nom) + '</span></label>';
      }).join('') + '</div></fieldset>' : '') +
      (autreJour ? '<label>Faite le<input type="date" name="le" value="' + le + '" min="' + date + '" max="' + aj + '"></label>' : '') +
      '<div class="champs"><label data-champ="km">Distance (km)<input name="km" inputmode="decimal" value="' + (C.isNum(j.km) ? C.nombreFR(j.km, 3) : '') + '" placeholder="12,5"></label>' +
      '<label data-champ="dplus">D+ (m, facultatif)<input name="dplus" inputmode="numeric" value="' + (C.isNum(j.dplus) ? Math.round(j.dplus) : '') + '" placeholder="150"></label>' +
      // Durée en trois cases chiffrées : le pavé numérique de l'iPhone n'a pas de « : »
      '<div class="duree-hms"><span class="etiq-champ" id="lblDuree">Durée</span><div class="hms" role="group" aria-labelledby="lblDuree">' +
      [['dh', 'h', Math.floor(ds / 3600), '1'], ['dm', 'min', Math.floor(ds % 3600 / 60), '15'], ['ds', 's', ds % 60, '45']].map(function (x) {
        return '<label><input name="' + x[0] + '" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off" value="' + (aDuree ? x[2] : '') + '" placeholder="' + x[3] + '" aria-label="' + ({ h: 'heures', min: 'minutes', s: 'secondes' })[x[1]] + '"><span>' + x[1] + '</span></label>';
      }).join('') + '</div></div>' +
      '<label>FC moyenne (bpm)<input name="fc" inputmode="numeric" pattern="[0-9]*" maxlength="3" value="' + (C.isNum(j.fc) ? Math.round(j.fc) : '') + '" placeholder="145"></label>' +
      // Profil / terrain réellement couru (suggestions : profils de la légende de l'entraîneur)
      '<label data-champ="terrain">Profil / terrain<input name="terrain" list="dlTerrains" maxlength="60" autocomplete="off" value="' + esc(C.terrain(a.jours[date])) + '" placeholder="' + esc(j.profil || 'ex. Voie verte') + '"></label>' +
      '<datalist id="dlTerrains">' + ((A.commun.legende || DEFAUTS.legende).profils || []).map(function (p) { return '<option value="' + esc(p.code) + '">' + esc(p.desc) + '</option>'; }).join('') + '</datalist>' +
      // Paire utilisée : menu des paires en service (course et marche)
      (function () {
        var ch = chaussures(), act = ch.liste.filter(function (c) { return !c.retiree || ch.parDate[date] === c.id; });
        if (!act.length) return '';
        var sel = ch.parDate[date] || (C.aRetour(j) ? '' : ch.defaut);
        return '<label data-champ="chaussure" class="large">Chaussures<select name="chaussure"><option value="">—</option>' +
          act.map(function (c) { return '<option value="' + esc(c.id) + '"' + (c.id === sel ? ' selected' : '') + '>' + esc(c.nom) + '</option>'; }).join('') + '</select></label>';
      })() +
      '</div>' +
      '<fieldset class="ressenti"><legend>Ressenti (RPE)</legend>' + UI.htmlBarreRPE(j.rpe) +
      '<p class="muet petit">À noter 30 min après la séance : 1 très facile → 10 effort maximal.</p></fieldset>' +
      '<label>Notes (ressenti, douleurs, conditions…)<textarea name="notes" maxlength="2000">' + esc(j.notes) + '</textarea></label>' +
      '<p class="alerte" id="erreurSaisie" hidden></p><div class="pied">' + (C.aRetour(j) ? '<button type="button" class="danger" data-x="effacer">Effacer</button>' : '') +
      '<button type="button" class="sec" data-x="annuler">Annuler</button><button>Enregistrer</button></div></form>';
    boite.innerHTML = h; boite.showModal();
    var f = $('form', boite);
    UI.brancherBarreRPE(f);
    // Champs sans objet selon la discipline : distance (renforcement), D+ (natation, renforcement), chaussures (vélo, natation, renforcement)
    function discipline() { var c = f.querySelector('input[name="activite"]:checked'); return C.ACTIVITES.filter(function (x) { return x.code === (c ? c.value : 'course'); })[0]; }
    function majChamps() {
      var x = discipline();
      $$('[data-champ]', f).forEach(function (l) { var k = l.dataset.champ; l.hidden = (k === 'km' && x.sansDistance) || (k === 'terrain' && x.sansDistance) || (k === 'dplus' && x.sansDplus) || (k === 'chaussure' && !x.chaussures); });
    }
    $$('input[name="activite"]', f).forEach(function (r) { r.onchange = majChamps; });
    majChamps();
    // Passage automatique à la case suivante après deux chiffres (minutes, secondes)
    ['dh', 'dm'].forEach(function (n, i) {
      var el = f.elements[n], suiv = f.elements[['dm', 'ds'][i]];
      el.oninput = function () { el.value = el.value.replace(/\D/g, ''); if (el.value.length >= 2) suiv.focus(); };
    });
    f.elements.ds.oninput = function () { this.value = this.value.replace(/\D/g, ''); };
    $('[data-x="annuler"]', f).onclick = function () { boite.close(); };
    var ef = $('[data-x="effacer"]', f);
    if (ef) ef.onclick = function () {
      if (!confirm('Effacer ta saisie du ' + C.formatDateFR(date) + ' ?')) return;
      var n = Object.assign({}, j); C.CHAMPS_ATHLETE.forEach(function (k) { delete n[k]; });
      delete chaussures().parDate[date];
      enregistrer(date, n, undefined, undefined, ''); boite.close();
    };
    f.onsubmit = function (ev) {
      ev.preventDefault();
      var d = new FormData(f), err = [];
      var disc = discipline();
      var km = disc.sansDistance ? null : C.parseNumberFR(d.get('km')), du = lireDuree(d), dp = disc.sansDplus ? null : C.parseNumberFR(d.get('dplus')), fc = C.parseNumberFR(d.get('fc')), rpe = d.get('rpe') ? Number(d.get('rpe')) : null;
      if (km !== null && !(km >= 0 && km < 400)) err.push('Distance : nombre attendu, ex. 12,5');
      if (du !== null && !(du > 0 && du < 172800)) err.push('Durée : heures, minutes (0 à 59) et secondes (0 à 59)');
      if (dp !== null && !(dp >= 0 && dp < 20000)) err.push('D+ : nombre de mètres');
      if (fc !== null && !(fc >= 30 && fc <= 250 && Math.round(fc) === fc)) err.push('FC moyenne : nombre entier de battements par minute, entre 30 et 250');
      if (km === null && du === null && rpe === null && !C.texte(d.get('notes'))) err.push('Renseigne au moins la distance ou la durée');
      if (err.length) { var e = $('#erreurSaisie'); e.hidden = false; e.textContent = err.join(' · '); return; }
      var leJour = String(d.get('le') || '');
      if (autreJour && !(leJour >= date && leJour <= aj)) err.push('Date de la séance : entre le ' + C.formatDateFR(date) + ' et aujourd\'hui');
      if (err.length) { var e2 = $('#erreurSaisie'); e2.hidden = false; e2.textContent = err.join(' · '); return; }
      var notes = choixAct ? C.noteActivite(disc.code, d.get('notes')) : d.get('notes');
      var n = Object.assign({}, j, { km: km, dureeSec: du, dplus: dp, rpe: rpe, fc: fc, notes: autreJour && leJour !== date ? C.noteFaiteLe(leJour, notes) : notes });
      var chx = disc.chaussures ? d.get('chaussure') : '', ch = chaussures();
      if (chx) ch.parDate[date] = chx; else delete ch.parDate[date];
      enregistrer(date, n, undefined, undefined, C.texte(d.get('terrain'))); boite.close();
    };
  }
  // extras : nouvelle liste des activités en plus du jour ; sans elle, celles déjà enregistrées sont gardées
  // ter : terrain de la séance (sans lui, celui déjà enregistré est gardé)
  function enregistrer(date, j, message, extras, ter) {
    var a = A.athlete;
    j.notes = C.avecExtras(j.notes, extras || C.extras(a.jours[date]), ter !== undefined ? ter : C.terrain(a.jours[date]));
    j.majA = UI.maintenant();
    var n = C.nettoyerJour(j);
    a.jours[date] = n;
    A.enAttente[date] = true;
    sauver().then(function () { toast(message || 'Séance enregistrée 👏'); rendre(); synchroniser(false); });
  }

  /* ---------- Actions ---------- */
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-act], nav.onglets button');
    if (!b) return;
    if (b.dataset.v) { vue = b.dataset.v; rendre(); window.scrollTo(0, 0); return; }
    var act = b.dataset.act, a = A.athlete;
    if (act === 'saisir') saisir(b.dataset.date);
    else if (act === 'extra') autreActivite(b.dataset.date, b.dataset.i != null ? Number(b.dataset.i) : null);
    else if (act === 'pasFaite') pasFaite(b.dataset.date);
    else if (act === 'sync') synchroniser(true);
    else if (act === 'semPrec') { semaineAffichee = Math.max(UI.semaineMin(a), semaineAffichee - 1); rendre(); }
    else if (act === 'semSuiv') { semaineAffichee++; rendre(); }
    else if (act === 'semAuj') { semaineAffichee = Math.max(1, UI.semaineDe(a, auj())); rendre(); }
    else if (act === 'allerSem') { semaineAffichee = +b.dataset.n; rendre(); window.scrollTo(0, 0); }
    else if (act === 'imprimer') window.print();
    else if (act === 'chaussures') gererChaussures();
    else if (act === 'reactionsVues') marquerReactionsVues();
  });
  $('#statutSync').addEventListener('click', function () { synchroniser(true); });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') synchroniser(false); });
  window.addEventListener('online', function () { synchroniser(false); });
  window.addEventListener('hashchange', function () { var c = C.codeDepuisLien(decodeURIComponent(location.hash.slice(1))); if (c && c !== A.code) changerCode(c); });
  setInterval(rendreStatut, 30000);
  setInterval(function () { if (vue === 'messages' && document.visibilityState === 'visible') chargerMessages(true); }, 30000);

  Promise.all([Store.charger(), UI.chargerConfig('../config.json')]).then(function (r) {
    var d = r[0]; config = r[1] || {};
    if (d) { A = Object.assign(A, d); A.enAttente = A.enAttente || {}; }
    UI.appliquerTheme(A.reglages && A.reglages.theme);
    var c = C.codeDepuisLien(decodeURIComponent(location.hash.slice(1)));
    if (c && c !== A.code) { A.code = c; A.athlete = null; A.enAttente = {}; A.lienInvalide = false; A.messages = []; A.messagesConnus = false; A.reactionsVues = null; A.reactionsSignalees = {}; }
    rendre();
    synchroniser(false);
  });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
