<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A322A">
<meta name="description" content="My RespirOutdoor : ton plan d'entraînement course à pied, préparé par ton entraîneur Respir Outdoor.">
<meta name="apple-mobile-web-app-title" content="My RespirOutdoor">
<title>My RespirOutdoor</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
/* Couleurs mesurées sur le logo Respir Outdoor fourni (pas de codes officiels) :
   vert du lettrage #3A8376, vert sombre #0A322A, gris-vert du dragon #39564E. */
:root {
  --vert: #3A8376;          /* logo : barres de graphique, filets (4,5:1 sur blanc) */
  --vert-fonce: #2E6B60;    /* vert du logo assombri : boutons, liens (6,2:1) */
  --sapin: #0A322A;         /* logo : en-tête, titres (14:1) */
  --dragon: #39564E;        /* logo : texte secondaire (8:1) */
  --vert-clair: #E4F0ED;
  --fond: #F6F8F7;
  --carte: #FFFFFF;
  --texte: #0A322A;
  --texte-2: #4A5D57;
  --bord: #CCD9D5;
  --repos: #F0F3F2;
  --alerte: #9A3412;
  --alerte-fond: #FFF4EC;
  --rayon: 10px;
  --cible: 44px;
  --nav-h: 62px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --vert: #5FB3A2; --vert-fonce: #7CC5B5; --sapin: #DDEEE9; --dragon: #A9C2BA; --vert-clair: #18332D;
    --fond: #0D1714; --carte: #14211D; --texte: #E6F0ED; --texte-2: #A9BDB6; --bord: #2B403A; --repos: #111C19;
    --alerte: #FDBA74; --alerte-fond: #2A1A10; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --vert: #5FB3A2; --vert-fonce: #7CC5B5; --sapin: #DDEEE9; --dragon: #A9C2BA; --vert-clair: #18332D;
  --fond: #0D1714; --carte: #14211D; --texte: #E6F0ED; --texte-2: #A9BDB6; --bord: #2B403A; --repos: #111C19;
  --alerte: #FDBA74; --alerte-fond: #2A1A10; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--fond); color: var(--texte); padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom)); }
a { color: var(--vert-fonce); }
h1, h2, h3 { line-height: 1.2; margin: 0 0 .5rem; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.05rem; }
.lien-evitement { position: absolute; left: -999px; }
.lien-evitement:focus { left: 8px; top: 8px; z-index: 99; background: var(--carte); padding: 8px; }
:focus-visible { outline: 3px solid var(--vert); outline-offset: 2px; }

/* En-tête */
header.app { background: #0A322A; color: #fff; padding: 8px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
header.app .logo { background: #fff; border-radius: 8px; padding: 3px 6px; height: 46px; display: flex; align-items: center; }
header.app .logo img { height: 40px; width: auto; display: block; }
header.app .titre { flex: 1 1 160px; min-width: 0; }
header.app .titre strong { display: block; font-size: 1rem; letter-spacing: .02em; }
header.app .titre span { font-size: .8rem; opacity: .85; }
header.app select { max-width: 100%; min-height: 40px; border-radius: 8px; border: 0; padding: 0 8px; font: inherit; font-size: .9rem; }
.badge-role { font-size: .75rem; background: rgba(255,255,255,.15); border-radius: 99px; padding: 3px 10px; white-space: nowrap; }

/* Navigation : barre basse sur mobile, onglets en haut sur grand écran */
nav.onglets { position: fixed; bottom: 0; left: 0; right: 0; height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
  background: var(--carte); border-top: 1px solid var(--bord); display: flex; z-index: 20; }
nav.onglets a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--texte-2); font-size: .75rem; font-weight: 600; min-width: 0; }
nav.onglets a svg { width: 22px; height: 22px; }
nav.onglets a[aria-current="page"] { color: var(--vert-fonce); box-shadow: inset 0 3px 0 var(--vert); }
@media (min-width: 900px) {
  body { padding-bottom: 0; }
  nav.onglets { position: sticky; top: 0; height: auto; border-top: 0; border-bottom: 1px solid var(--bord); justify-content: center; }
  nav.onglets a { flex: 0 0 auto; flex-direction: row; padding: 12px 20px; font-size: .9rem; gap: 8px; }
  nav.onglets a[aria-current="page"] { box-shadow: inset 0 -3px 0 var(--vert); }
}

main { max-width: 1100px; margin: 0 auto; padding: 16px; }
.carte { background: var(--carte); border: 1px solid var(--bord); border-radius: var(--rayon); padding: 14px 16px; margin-bottom: 14px; }
.grille2 { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .grille2 { grid-template-columns: 1fr 1fr; } }
.muet { color: var(--texte-2); }
.petit { font-size: .85rem; }
.ligne { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.espace { flex: 1; }

button, .bouton { font: inherit; font-weight: 600; min-height: var(--cible); padding: 0 14px; border-radius: 8px; border: 1px solid var(--vert-fonce); background: var(--vert-fonce); color: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; }
:root[data-theme="dark"] button:not(.sec):not(.discret):not(.danger), :root[data-theme="dark"] .bouton:not(.sec) { color: #0D1714; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button:not(.sec):not(.discret):not(.danger), :root:not([data-theme="light"]) .bouton:not(.sec) { color: #0D1714; } }
button.sec, .bouton.sec { background: transparent; color: var(--vert-fonce); }
button.discret { background: transparent; border-color: transparent; color: var(--vert-fonce); padding: 0 8px; }
button.danger { background: transparent; color: var(--alerte); border-color: var(--alerte); }
button:disabled { opacity: .5; cursor: not-allowed; }
input, select, textarea { font: inherit; color: var(--texte); background: var(--carte); border: 1px solid var(--bord); border-radius: 8px; padding: 8px 10px; min-height: var(--cible); width: 100%; }
textarea { min-height: 80px; resize: vertical; }
input[type="checkbox"] { width: 22px; height: 22px; min-height: 0; accent-color: var(--vert-fonce); }
label { display: block; font-size: .85rem; font-weight: 600; color: var(--texte-2); margin-bottom: 10px; }
label > input, label > select, label > textarea { margin-top: 4px; }
.duree-hms { grid-column: 1 / -1; margin: 4px 0 12px; }
.duree-hms .etiq-champ { display: block; font-size: .85rem; font-weight: 600; color: var(--texte-2); }
.hms { display: flex; gap: 10px; margin-top: 6px; }
.hms label { display: flex; align-items: center; gap: 6px; flex: 1; margin: 0; font-weight: 600; color: var(--texte-2); }
.hms input { width: 100%; min-width: 0; text-align: center; margin: 0; }
.champs { display: grid; gap: 0 12px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
fieldset { border: 1px solid var(--bord); border-radius: var(--rayon); margin: 0 0 12px; padding: 10px 12px 2px; }
fieldset[disabled] { opacity: .6; }
legend { font-weight: 700; padding: 0 6px; }

/* Fiche athlète */
.fiche h2 { margin-bottom: 2px; }
.objectif { font-weight: 700; color: var(--vert-fonce); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 12px; }
.kpi { background: var(--vert-clair); border-radius: 8px; padding: 8px 10px; }
.kpi b { display: block; font-size: 1.2rem; }
.kpi span { font-size: .8rem; color: var(--texte-2); }
.dispos { display: flex; gap: 4px; }
.dispos span { width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; border: 1px solid var(--bord); color: var(--texte-2); }
.dispos span.oui { background: var(--vert-fonce); border-color: var(--vert-fonce); color: var(--carte); }

/* Semaine */
.nav-semaine { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.nav-semaine h2 { margin: 0; flex: 1; text-align: center; min-width: 180px; }
.nav-semaine h2 small { display: block; font-size: .8rem; font-weight: 400; color: var(--texte-2); }
.ruban { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 0; justify-content: center; }
.ruban span { font-size: .78rem; font-weight: 700; letter-spacing: .04em; border-radius: 99px; padding: 3px 12px; background: var(--vert-clair); color: var(--sapin); }
.ruban span.cycle { background: transparent; border: 1px dashed var(--vert); }
.jours { display: grid; gap: 10px; }
.jour { background: var(--carte); border: 1px solid var(--bord); border-left: 5px solid var(--fam, var(--bord)); border-radius: var(--rayon); padding: 10px 12px; }
.jour.repos { background: var(--repos); }
/* Contour du jour dessiné à l'intérieur : la carte garde la même largeur que les autres */
.jour.auj { box-shadow: inset 0 0 0 2px var(--vert); }
#contenu > div > .jour { margin-bottom: 14px; }
.jour .tete { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.jour .date { font-weight: 700; min-width: 92px; }
.jour .corps { font-weight: 700; font-size: 1.02rem; }
.jour.repos .corps { font-weight: 500; color: var(--texte-2); }
.puces { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.puce { font-size: .78rem; border: 1px solid var(--bord); border-radius: 99px; padding: 2px 9px; background: var(--carte); white-space: nowrap; }
.puce.type { border-color: var(--fam, var(--bord)); font-weight: 700; }
.puce.type::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--fam, var(--bord)); margin-right: 5px; }
.consigne { margin-top: 6px; font-size: .88rem; color: var(--alerte); font-weight: 600; }
.reperes { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
.repere { font-size: .8rem; background: var(--vert-clair); border-radius: 6px; padding: 3px 8px; }
.repere b { color: var(--sapin); }
.retour { margin-top: 8px; border-top: 1px dashed var(--bord); padding-top: 8px; display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: center; font-size: .9rem; }
.retour .note { flex-basis: 100%; font-style: italic; color: var(--texte-2); white-space: pre-wrap; }
.rpe { display: inline-block; min-width: 26px; text-align: center; border-radius: 6px; padding: 0 6px; font-weight: 700; color: var(--rpe-t, #fff); background: var(--rpe, var(--dragon)); }
details.def { margin-top: 6px; font-size: .82rem; color: var(--texte-2); }
details.def summary { cursor: pointer; min-height: 28px; }
.bilan { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }

/* Tableaux */
.tableau { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { border-bottom: 1px solid var(--bord); padding: 6px 8px; text-align: left; vertical-align: top; }
th { background: var(--vert-clair); color: var(--sapin); font-weight: 700; position: sticky; top: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.cour td { background: var(--vert-clair); }
tbody tr.cliquable { cursor: pointer; }
tbody tr.cliquable:hover td { background: var(--vert-clair); }

/* Graphique */
.graph { position: relative; }
.graph svg { width: 100%; height: auto; display: block; }
.graph .axe { fill: var(--texte-2); font-size: 11px; }
.graph .grille { stroke: var(--bord); stroke-width: 1; }
.graph rect.barre { fill: var(--vert); cursor: pointer; }
.graph rect.barre.cour { fill: var(--sapin); }
.graph rect.cible { fill: transparent; cursor: pointer; }
.infobulle { position: absolute; pointer-events: none; background: var(--carte); border: 1px solid var(--bord); border-radius: 8px; padding: 6px 10px; font-size: .8rem; box-shadow: 0 4px 14px rgba(0,0,0,.12); white-space: nowrap; display: none; z-index: 5; }

/* Légende */
.fam { display: inline-block; width: 12px; height: 12px; border-radius: 3px; background: var(--fam); vertical-align: -1px; margin-right: 6px; }
dl.codes { display: grid; grid-template-columns: minmax(64px, max-content) minmax(0, 1fr); gap: 6px 14px; margin: 0; }
dl.codes dt, dl.codes dd { min-width: 0; overflow-wrap: anywhere; }
dl.codes dt { font-weight: 700; }
dl.codes dd { margin: 0; color: var(--texte-2); }
mark { background: #FDE68A; color: #000; }

/* Protos */
.proto h3 { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.proto .code { font-size: .8rem; background: var(--sapin); color: var(--fond); border-radius: 6px; padding: 2px 8px; }
.proto table td { border: 1px solid var(--bord); }

.alerte { background: var(--alerte-fond); border: 1px solid var(--alerte); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
.vide { text-align: center; padding: 30px 16px; }
.vide img { max-width: 240px; width: 70%; }

dialog { border: 0; border-radius: 14px; padding: 0; width: min(680px, calc(100vw - 24px)); max-height: calc(100vh - 32px); background: var(--carte); color: var(--texte); }
dialog::backdrop { background: rgba(5,25,20,.55); }
dialog form.boite { padding: 16px; }
dialog .pied { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; position: sticky; bottom: 0; background: var(--carte); padding-top: 10px; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 16px); background: var(--sapin); color: var(--fond); padding: 10px 16px; border-radius: 8px; display: none; z-index: 50; max-width: calc(100vw - 32px); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media print {
  nav.onglets, header.app select, .noprint, button { display: none !important; }
  body { background: #fff; padding: 0; }
  .carte, .jour { break-inside: avoid; }
}

/* ---------- Synchronisation, tableau de bord, athlète ---------- */
header.app .statut { font: inherit; font-size: .75rem; font-weight: 500; min-height: 32px; padding: 4px 10px; border-radius: 99px; border: 0; background: rgba(255,255,255,.15); color: #fff; cursor: pointer; max-width: 100%; text-align: left; }
header.app .statut.attention { background: #FDE68A; color: #3B2F00; }
body.athlete header.app .titre span { font-size: .95rem; opacity: 1; }
nav.onglets button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: none; border: 0; border-radius: 0; color: var(--texte-2); font-size: .75rem; font-weight: 600; min-width: 0; padding: 0; min-height: 0; }
nav.onglets button svg { width: 22px; height: 22px; }
nav.onglets button[aria-current="page"] { color: var(--vert-fonce); box-shadow: inset 0 3px 0 var(--vert); }
nav.onglets[hidden] { display: none; }
@media (min-width: 900px) {
  nav.onglets button { flex: 0 0 auto; flex-direction: row; padding: 12px 20px; font-size: .9rem; gap: 8px; }
  nav.onglets button[aria-current="page"] { box-shadow: inset 0 -3px 0 var(--vert); }
}
@media (max-width: 420px) { nav.onglets a, nav.onglets button { font-size: .68rem; } }
/* Barre d'onglets sur fond sapin dans les deux modes : vert clair (contraste 9,2:1), onglet actif en blanc (14:1) */
nav.onglets { background: #0A322A; border-top-color: #0A322A; border-bottom-color: #0A322A; }
:root nav.onglets button:not(.sec):not(.discret):not(.danger), :root nav.onglets a { color: #A8DCCF; }
:root nav.onglets button[aria-current="page"]:not(.sec):not(.discret):not(.danger), :root nav.onglets a[aria-current="page"] { color: #FFFFFF; box-shadow: inset 0 3px 0 #7CC5B5; }
@media (min-width: 900px) { :root nav.onglets button[aria-current="page"]:not(.sec):not(.discret):not(.danger), :root nav.onglets a[aria-current="page"] { box-shadow: inset 0 -3px 0 #7CC5B5; } }
:root[data-theme="dark"] nav.onglets button:not(.sec):not(.discret):not(.danger) { color: #A8DCCF; }
:root[data-theme="dark"] nav.onglets button[aria-current="page"]:not(.sec):not(.discret):not(.danger) { color: #FFFFFF; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) nav.onglets button:not(.sec):not(.discret):not(.danger) { color: #A8DCCF; }
  :root:not([data-theme="light"]) nav.onglets button[aria-current="page"]:not(.sec):not(.discret):not(.danger) { color: #FFFFFF; }
}
.titre-section { font-size: 1.1rem; margin: 18px 0 10px; }
.kpis2 { grid-template-columns: repeat(2, 1fr); }
@media (min-width: 760px) { .kpis2 { grid-template-columns: repeat(4, 1fr); } }
.kpi .etiq { display: block; font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--texte-2); }
.kpi .ecart { display: block; font-size: .8rem; color: var(--texte-2); }
.mot { border-left: 5px solid var(--vert); }
.mot p { margin: 6px 0 0; white-space: pre-wrap; }
.compet { display: flex; gap: 14px; align-items: center; }
.compet .jx { font-size: 1.4rem; font-weight: 800; color: var(--fond); background: var(--sapin); border-radius: 10px; padding: 8px 12px; white-space: nowrap; }
ul.records { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
ul.records li { display: grid; grid-template-columns: 1fr auto; gap: 0 10px; border-bottom: 1px solid var(--bord); padding-bottom: 6px; }
ul.records li .petit { grid-column: 1 / -1; }
ul.liste { margin: 0; padding-left: 18px; }
.voyant { color: var(--alerte); font-weight: 800; }
.reaction { flex-basis: 100%; font-weight: 600; color: var(--vert-fonce); }
.lien-athlete { word-break: break-all; background: var(--vert-clair); border-radius: 8px; padding: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85rem; }
.emojis { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.emojis label { margin: 0; }
.emojis input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.emojis span { display: inline-flex; align-items: center; justify-content: center; width: 52px; height: 52px; font-size: 1.6rem; border: 2px solid var(--bord); border-radius: 12px; cursor: pointer; }
.emojis input:checked + span { border-color: var(--vert-fonce); background: var(--vert-clair); }
.emojis input:focus-visible + span { outline: 3px solid var(--vert); outline-offset: 2px; }
.echelle { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.echelle span { background: var(--rpe); color: var(--rpe-t, #000); border-radius: 8px; padding: 6px 4px; text-align: center; font-size: .7rem; font-weight: 600; min-height: 52px; display: flex; flex-direction: column; justify-content: center; }
.echelle b { font-size: 1.05rem; }

/* Barre RPE à glisser (dégradé bleu → noir) */
.barre-rpe { --rpe: var(--bord); }
.barre-rpe input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; min-height: 44px; padding: 0; border: 0; background: transparent; cursor: pointer; }
.barre-rpe input[type="range"]::-webkit-slider-runnable-track { height: 14px; border-radius: 99px; background: var(--degrade); }
.barre-rpe input[type="range"]::-moz-range-track { height: 14px; border-radius: 99px; background: var(--degrade); }
.barre-rpe input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; margin-top: -8px; border-radius: 50%; background: #fff; border: 4px solid var(--rpe); box-shadow: 0 1px 4px rgba(0,0,0,.35); }
.barre-rpe input[type="range"]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 4px solid var(--rpe); box-shadow: 0 1px 4px rgba(0,0,0,.35); }
.barre-rpe.vide input[type="range"]::-webkit-slider-thumb { border-color: var(--bord); opacity: .8; }
.barre-rpe.vide input[type="range"]::-moz-range-thumb { border-color: var(--bord); opacity: .8; }
.barre-rpe .graduations { display: flex; justify-content: space-between; padding: 0 8px; font-size: .75rem; color: var(--texte-2); }
.barre-rpe .graduations span { width: 22px; text-align: center; font-size: .85rem; }
.barre-rpe .graduations span.choisi { font-weight: 800; color: var(--texte); font-size: 1.05rem; }

/* ---------- Animation d'ouverture « Épure » (2 s) : logo seul sur fond blanc, puis fondu vers l'application ---------- */
#ouverture { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: #FFFFFF;
  animation: ouv-sortie .45s ease-in 1.55s forwards; }
#ouverture .ouv-logo { opacity: 0; transform: scale(.96); animation: ouv-logo .7s cubic-bezier(.2,.7,.2,1) .15s forwards; }
#ouverture .ouv-logo img { display: block; width: min(220px, 56vw); height: auto; }
@keyframes ouv-logo { to { opacity: 1; transform: none; } }
@keyframes ouv-sortie { to { opacity: 0; visibility: hidden; } }
@media (prefers-reduced-motion: reduce) {
  #ouverture .ouv-logo { animation-duration: .01s !important; animation-delay: 0s !important; }
  #ouverture { animation: ouv-sortie .2s ease-in .4s forwards !important; }
}
@media print { #ouverture { display: none; } }

/* ---------- Harmonisation des cartes et tableaux ---------- */
:root { --rayon: 14px; }
.carte { padding: 16px; margin-bottom: 14px; min-width: 0; box-shadow: 0 1px 3px rgba(10, 50, 42, .06); }
.carte > h2, .carte > h3 { font-size: 1.1rem; margin-bottom: .75rem; }
.grille2 { grid-template-columns: minmax(0, 1fr); gap: 0 14px; }
@media (min-width: 760px) { .grille2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tableau { overflow-x: auto; border: 1px solid var(--bord); border-radius: 10px; -webkit-overflow-scrolling: touch; }
.tableau table { font-size: .9rem; }
.tableau th, .tableau td { padding: 9px 10px; }
.tableau thead th { font-size: .8rem; letter-spacing: .02em; border-bottom: 1px solid var(--bord); }
.tableau tbody tr:last-child > * { border-bottom: 0; }
.tableau tbody tr:nth-child(even) > td, .tableau tbody tr:nth-child(even) > th { background: var(--repos); }
.kpis { gap: 8px; }
.kpi { border-radius: 10px; padding: 10px 12px; }
.kpi b { font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.valeurs { margin-top: 0; }
dl.codes { gap: 0 14px; }
dl.codes dt, dl.codes dd { padding: 7px 0; border-bottom: 1px solid var(--bord); }
dl.codes dt:last-of-type, dl.codes dd:last-of-type { border-bottom: 0; }
.echelle { gap: 8px; }
.echelle span { border-radius: 10px; min-height: 58px; font-size: .72rem; padding: 6px 4px; }
/* Tableau de bord en colonnes */
.bilan-tab { font-size: .84rem; }
.tableau table.compact { font-size: .82rem; }
.tableau table.compact th, .tableau table.compact td { padding: 8px 6px; }
.tableau table.compact th:first-child, .tableau table.compact td:first-child { padding-left: 10px; }
.tableau table.compact th:last-child, .tableau table.compact td:last-child { padding-right: 10px; }
.tableau .bilan-tab th, .tableau .bilan-tab td { padding: 8px 6px; }
.tableau .bilan-tab th:first-child { padding-left: 10px; }
.tableau .bilan-tab th:last-child, .tableau .bilan-tab td:last-child { padding-right: 10px; }
.bilan-tab th[scope="row"] { color: var(--texte-2); font-size: .78rem; position: static; white-space: nowrap; }
.bilan-tab tbody tr:nth-child(odd) > th[scope="row"] { background: transparent; }
.bilan-tab thead th small { display: block; font-weight: 500; font-size: .7rem; color: var(--texte-2); }
.bilan-tab td b, .bilan-tab td { font-weight: 700; }
.tableau .ecart { display: block; font-size: .72rem; font-weight: 500; color: var(--texte-2); }
.tableau .ecart.voyant { color: var(--alerte); font-weight: 700; }
/* Chaussures */
.jauge { height: 6px; border-radius: 3px; background: var(--bord); margin-top: 6px; overflow: hidden; max-width: 160px; }
.jauge span { display: block; height: 100%; background: var(--vert); border-radius: 3px; }
.jauge.pleine span { background: var(--alerte); }

/* Séance pas réalisée */
.pas-faite { display: inline-block; font-size: .78rem; font-weight: 700; color: #fff; background: var(--alerte); border-radius: 99px; padding: 2px 10px; white-space: nowrap; }
:root[data-theme="dark"] .pas-faite { color: #2A1A10; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pas-faite { color: #2A1A10; } }
.alerte-nf { border-left: 5px solid var(--alerte); }
ul.liste-nf { list-style: none; margin: 0; padding: 0; }
ul.liste-nf li { padding: 8px 0; border-bottom: 1px solid var(--bord); }
ul.liste-nf li:last-child { border-bottom: 0; }
ul.liste-nf .note { font-style: italic; color: var(--texte-2); margin-top: 4px; white-space: pre-wrap; }
.raisons { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.raisons label { margin: 0; }
.raisons input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.raisons span { display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border: 1px solid var(--bord); border-radius: 99px; font-weight: 600; color: var(--texte); cursor: pointer; }
.raisons input:checked + span { background: var(--vert-fonce); border-color: var(--vert-fonce); color: var(--carte); }
.raisons input:focus-visible + span { outline: 3px solid var(--vert); outline-offset: 2px; }
/* Boutons du bas des fenêtres sur téléphone : action principale sur toute la largeur, les autres côte à côte en dessous */
@media (max-width: 560px) {
  dialog .pied { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding-bottom: 4px; }
  dialog .pied > * { width: 100%; margin: 0; }
  dialog .pied > button:not(.sec):not(.danger):not(.discret) { grid-column: 1 / -1; order: -1; }
  dialog .pied:not(:has(> :nth-child(3))) > * { grid-column: 1 / -1; }
}
/* Assistant d'aide (application de l'entraîneur) */
.aide-bouton { position: fixed; z-index: 60; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px));
  border-radius: 99px; padding: 0 16px 0 12px; min-height: 46px; box-shadow: 0 6px 18px rgba(10, 50, 42, .25); }
.aide-bouton svg { width: 22px; height: 22px; }
.aide-panneau { position: fixed; z-index: 61; right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(var(--nav-h) + 72px + env(safe-area-inset-bottom, 0px));
  width: min(400px, calc(100vw - 24px)); height: min(560px, calc(100vh - var(--nav-h) - 110px)); display: flex; flex-direction: column;
  background: var(--carte); border: 1px solid var(--bord); border-radius: 16px; box-shadow: 0 18px 50px rgba(0, 0, 0, .25); overflow: hidden; }
.aide-panneau[hidden] { display: none; }
@media (min-width: 900px) { .aide-bouton { bottom: 20px; } .aide-panneau { bottom: 78px; height: min(600px, calc(100vh - 120px)); } }
.aide-tete { display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 8px 16px; background: #0A322A; color: #fff; }
.aide-tete .discret { color: #A8DCCF; min-height: 36px; }
.aide-liste { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.aide-msg { max-width: 92%; border-radius: 14px; padding: 10px 12px; font-size: .92rem; line-height: 1.45; }
.aide-msg p, .aide-msg ol, .aide-msg ul { margin: 6px 0 0; }
.aide-msg ol, .aide-msg ul { padding-left: 20px; }
.aide-msg > :first-child { margin-top: 0; }
.aide-msg.bot { background: var(--vert-clair); color: var(--texte); align-self: flex-start; border-bottom-left-radius: 4px; }
.aide-msg.moi { background: var(--vert-fonce); color: var(--carte); align-self: flex-end; border-bottom-right-radius: 4px; }
.aide-puces { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.aide-puce { min-height: 34px; padding: 4px 12px; border-radius: 99px; font-size: .82rem; font-weight: 600; background: var(--carte); color: var(--vert-fonce); border: 1px solid var(--bord); text-align: left; }
.aide-aller { font-weight: 700; }
.aide-voir { font-weight: 600; }
.aide-form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--bord); }
.aide-form input { flex: 1; min-width: 0; }
/* Messagerie */
.pastille { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #D9534F; color: #fff; font-size: .68rem; font-weight: 800; line-height: 1; }
nav.onglets a, nav.onglets button { position: relative; }
nav.onglets .pastille { position: absolute; top: 6px; left: calc(50% + 6px); }
@media (min-width: 900px) { nav.onglets .pastille { position: static; margin-left: 4px; } }
.messagerie .fil { display: flex; flex-direction: column; gap: 8px; max-height: 55vh; min-height: 160px; overflow-y: auto; padding: 4px 2px 8px; }
.bulle { max-width: 82%; border-radius: 14px; padding: 8px 12px; }
.bulle .txt { white-space: pre-wrap; overflow-wrap: anywhere; }
.bulle .quand { font-size: .72rem; opacity: .75; margin-top: 2px; }
.bulle.moi { align-self: flex-end; background: var(--vert-fonce); color: var(--carte); border-bottom-right-radius: 4px; }
.bulle.lui { align-self: flex-start; background: var(--vert-clair); color: var(--texte); border-bottom-left-radius: 4px; }
.envoi { display: flex; gap: 8px; align-items: flex-end; margin-top: 10px; border-top: 1px solid var(--bord); padding-top: 10px; }
.envoi textarea { flex: 1; min-height: 44px; resize: vertical; }
.messagerie-coach { display: grid; gap: 14px; }
@media (min-width: 900px) { .messagerie-coach { grid-template-columns: minmax(240px, 1fr) 2fr; align-items: start; } }
ul.convs { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-height: 40vh; overflow-y: auto; }
@media (min-width: 900px) { ul.convs { max-height: 65vh; } }
button.conv { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; text-align: left; background: transparent; color: var(--texte); border: 1px solid var(--bord); padding: 8px 12px; min-height: 0; font-weight: 400; }
button.conv b { font-weight: 700; }
button.conv .apercu { grid-column: 1 / -1; font-size: .82rem; color: var(--texte-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
button.conv.choisie { border-color: var(--vert); background: var(--vert-clair); }
:root[data-theme="dark"] button.conv { color: var(--texte); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button.conv { color: var(--texte); } }
.carte.nouveau { border-left: 5px solid var(--vert); }
.decalee { display: inline-block; font-size: .78rem; font-weight: 700; color: var(--carte); background: var(--vert-fonce); border-radius: 99px; padding: 2px 10px; white-space: nowrap; }
label.choix { display: flex; align-items: center; gap: 10px; flex-wrap: nowrap; font-size: 1rem; color: var(--texte); font-weight: 400; margin-bottom: 8px; }
label.choix > input[type="radio"] { width: 22px; height: 22px; min-height: 0; margin: 0; accent-color: var(--vert-fonce); }
label.choix > span { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-width: 0; }
label.choix input[type="date"] { width: auto; max-width: 100%; margin: 0; min-height: 40px; }
/* Courses (COMP) : « médaille dorée » ; protocole pré-compétition (PROTO) en plus discret */
:root { --or-vif: #D9A21B; --or: #9A6B00; --or-fond: rgba(217, 162, 27, .16); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --or: #F0C04A; } }
:root[data-theme="dark"] { --or: #F0C04A; }
.jour.course { border: 2px solid var(--or-vif); border-left: 6px solid var(--or-vif); background: linear-gradient(135deg, var(--or-fond), rgba(217, 162, 27, 0) 65%), var(--carte); }
.jour.course .corps { color: var(--or); font-size: 1.15rem; }
.jour.course .puce.type { background: var(--or-vif); border-color: var(--or-vif); color: #1A1200; }
.jour.course .puce.type::before { content: '🏅'; background: none; width: auto; height: auto; margin-right: 4px; border-radius: 0; }
.jour.course.auj { box-shadow: inset 0 0 0 2px var(--or-vif); }
.carte.compet { border: 2px solid var(--or-vif); background: linear-gradient(135deg, var(--or-fond), rgba(217, 162, 27, 0) 65%), var(--carte); }
.carte.compet .jx { background: var(--or-vif); color: #1A1200; }
</style>

<script id="core">

  var CHAMP_REACTION = 'reaction';

  var CLES_LOCALES = ['code', 'motCoach'];

  // Libellés et couleurs relevés sur cette image ; les niveaux sans libellé restent sans libellé.
  var ECHELLE_RPE = { 1: 'Très facile', 2: 'Facile', 4: 'Modéré', 7: 'Difficile', 9: 'Très difficile', 10: 'Effort maximal' };
  // Dégradé de la barre RPE (couleurs relevées sur l'image fournie) : bleu, cyan, vert, jaune, orange, rouge.
  // Niveau n placé à (n − 1) / 9 du dégradé ; les niveaux entre deux couleurs sont interpolés.
  var DEGRADE_RPE = ['#4879C6', '#63C6DD', '#60C462', '#FECF63', '#F2804A', '#C54135'];
  function couleurDegrade(t) {
    var n = DEGRADE_RPE.length - 1, x = Math.max(0, Math.min(1, t)) * n, i = Math.min(n - 1, Math.floor(x)), f = x - i;
    var a = DEGRADE_RPE[i], b = DEGRADE_RPE[i + 1], s = '#';
    for (var k = 1; k < 7; k += 2) {
      var v = Math.round(parseInt(a.substr(k, 2), 16) * (1 - f) + parseInt(b.substr(k, 2), 16) * f);

  function texteSur(hex) {

  function libelleRPE(v) { if (!isNum(v) || v < 1 || v > 10) return null; var n = Math.round(v); return { niveau: n, libelle: ECHELLE_RPE[n] || '', couleur: COULEURS_RPE[n], texte: texteSur(COULEURS_RPE[n]) }; }

  // Kilomètres par paire de chaussures : km déjà parcourus à l'ajout + km des séances associées à la paire

<script>

  };

  /* ---------- Utilitaires ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function prenom(a) { var p = C.texte(a.prenom); return p ? p.charAt(0).toUpperCase() + p.slice(1).toLowerCase() : ''; }

  }

    if (s < 60) return 'à l\'instant';
    if (s < 3600) return 'il y a ' + Math.round(s / 60) + ' min';
    if (s < 86400) return 'il y a ' + Math.round(s / 3600) + ' h';

  function ecart(v, prec, format) {

  }

  /* ---------- Stockage local : IndexedDB, repli localStorage puis mémoire ---------- */
  function creerStore(nom) {
    var db = null, api = { mode: null };
    function ouvrir() {
      return new Promise(function (ok, ko) {
        if (!window.indexedDB) return ko(new Error('IndexedDB indisponible'));
        var r = indexedDB.open(nom, 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
        r.onsuccess = function () { ok(r.result); };
        r.onerror = function () { ko(r.error); };
      });
    }
    api.charger = function () {
      return ouvrir().then(function (d) {
        db = d; api.mode = 'IndexedDB';
        return new Promise(function (ok, ko) { var q = db.transaction('kv').objectStore('kv').get('etat'); q.onsuccess = function () { ok(q.result || null); }; q.onerror = function () { ko(q.error); }; });
      }).catch(function () {
        try { api.mode = 'localStorage'; var b = localStorage.getItem(nom); return b ? JSON.parse(b) : null; }

      if (api.mode === 'IndexedDB') return new Promise(function (ok, ko) {
        var t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(JSON.parse(JSON.stringify(etat)), 'etat');

  /* ---------- Service en ligne (script Google de l'entraîneur) ---------- */

  /* ---------- Carte d'un jour ---------- */

  /* ---------- Fiche (en-tête du plan) ---------- */
  function htmlFiche(a, aj, boutons) {

  /* ---------- Saisie d'une séance ---------- */
  // Durée en secondes depuis les cases h / min / s ; null si tout est vide, NaN si une valeur est invalide
  function lireDuree(d) {
    var v = ['dh', 'dm', 'ds'].map(function (k) { return String(d.get(k) || '').trim(); });
    if (!v.join('')) return null;
    var n = v.map(function (x) { return x === '' ? 0 : /^\d{1,2}$/.test(x) ? Number(x) : NaN; });
    if (n.some(isNaN) || n[1] > 59 || n[2] > 59) return NaN;
    return n[0] * 3600 + n[1] * 60 + n[2];
  }
