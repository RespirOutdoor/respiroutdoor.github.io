<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A322A">
<meta name="description" content="Plans d'entraînement course à pied Respir Outdoor : plan, légende, allures et protocoles. Données stockées sur l'appareil.">
<title>Respir Outdoor — Plans d'entraînement course à pied</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* Couleurs mesurées sur le logo Respir Outdoor fourni (pas de codes officiels) :
   vert du lettrage #3A8376, vert sombre #0A322A, gris-vert du dragon #39564E. */
:root {
  --vert: #3A8376;          /* logo : barres de graphique, filets (4,5:1 sur blanc) */
  --vert-fonce: #2E6B60;    /* vert du logo assombri : boutons, liens (6,2:1) */
  --sapin: #0A322A;         /* logo : en-tête, titres (14:1) */
  --dragon: #39564E;        /* logo : texte secondaire (8:1) */
  --vert-clair: #E4F0ED;
  --fond: #F6F8F7;
  --carte: #FFFFFF;
  --texte: #0A322A;
  --texte-2: #4A5D57;
  --bord: #CCD9D5;
  --repos: #F0F3F2;
  --alerte: #9A3412;
  --alerte-fond: #FFF4EC;
  --rayon: 10px;
  --cible: 44px;
  --nav-h: 62px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --vert: #5FB3A2; --vert-fonce: #7CC5B5; --sapin: #DDEEE9; --dragon: #A9C2BA; --vert-clair: #18332D;
    --fond: #0D1714; --carte: #14211D; --texte: #E6F0ED; --texte-2: #A9BDB6; --bord: #2B403A; --repos: #111C19;
    --alerte: #FDBA74; --alerte-fond: #2A1A10; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --vert: #5FB3A2; --vert-fonce: #7CC5B5; --sapin: #DDEEE9; --dragon: #A9C2BA; --vert-clair: #18332D;
  --fond: #0D1714; --carte: #14211D; --texte: #E6F0ED; --texte-2: #A9BDB6; --bord: #2B403A; --repos: #111C19;
  --alerte: #FDBA74; --alerte-fond: #2A1A10; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--fond); color: var(--texte); padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom)); }
a { color: var(--vert-fonce); }
h1, h2, h3 { line-height: 1.2; margin: 0 0 .5rem; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.05rem; }
.lien-evitement { position: absolute; left: -999px; }
.lien-evitement:focus { left: 8px; top: 8px; z-index: 99; background: var(--carte); padding: 8px; }
:focus-visible { outline: 3px solid var(--vert); outline-offset: 2px; }

/* En-tête */
header.app { background: #0A322A; color: #fff; padding: 8px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
header.app .logo { background: #fff; border-radius: 8px; padding: 3px 6px; height: 46px; display: flex; align-items: center; }
header.app .logo img { height: 40px; width: auto; display: block; }
header.app .titre { flex: 1 1 160px; min-width: 0; }
header.app .titre strong { display: block; font-size: 1rem; letter-spacing: .02em; }
header.app .titre span { font-size: .8rem; opacity: .85; }
header.app select { max-width: 100%; min-height: 40px; border-radius: 8px; border: 0; padding: 0 8px; font: inherit; font-size: .9rem; }
.badge-role { font-size: .75rem; background: rgba(255,255,255,.15); border-radius: 99px; padding: 3px 10px; white-space: nowrap; }

/* Navigation : barre basse sur mobile, onglets en haut sur grand écran */
nav.onglets { position: fixed; bottom: 0; left: 0; right: 0; height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
  background: var(--carte); border-top: 1px solid var(--bord); display: flex; z-index: 20; }
nav.onglets a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--texte-2); font-size: .75rem; font-weight: 600; min-width: 0; }
nav.onglets a svg { width: 22px; height: 22px; }
nav.onglets a[aria-current="page"] { color: var(--vert-fonce); box-shadow: inset 0 3px 0 var(--vert); }
@media (min-width: 900px) {
  body { padding-bottom: 0; }
  nav.onglets { position: sticky; top: 0; height: auto; border-top: 0; border-bottom: 1px solid var(--bord); justify-content: center; }
  nav.onglets a { flex: 0 0 auto; flex-direction: row; padding: 12px 20px; font-size: .9rem; gap: 8px; }
  nav.onglets a[aria-current="page"] { box-shadow: inset 0 -3px 0 var(--vert); }
}

main { max-width: 1100px; margin: 0 auto; padding: 16px; }
.carte { background: var(--carte); border: 1px solid var(--bord); border-radius: var(--rayon); padding: 14px 16px; margin-bottom: 14px; }
.grille2 { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .grille2 { grid-template-columns: 1fr 1fr; } }
.muet { color: var(--texte-2); }
.petit { font-size: .85rem; }
.ligne { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.espace { flex: 1; }

button, .bouton { font: inherit; font-weight: 600; min-height: var(--cible); padding: 0 14px; border-radius: 8px; border: 1px solid var(--vert-fonce); background: var(--vert-fonce); color: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; }
:root[data-theme="dark"] button:not(.sec):not(.discret):not(.danger), :root[data-theme="dark"] .bouton:not(.sec) { color: #0D1714; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button:not(.sec):not(.discret):not(.danger), :root:not([data-theme="light"]) .bouton:not(.sec) { color: #0D1714; } }
button.sec, .bouton.sec { background: transparent; color: var(--vert-fonce); }
button.discret { background: transparent; border-color: transparent; color: var(--vert-fonce); padding: 0 8px; }
button.danger { background: transparent; color: var(--alerte); border-color: var(--alerte); }
button:disabled { opacity: .5; cursor: not-allowed; }
input, select, textarea { font: inherit; color: var(--texte); background: var(--carte); border: 1px solid var(--bord); border-radius: 8px; padding: 8px 10px; min-height: var(--cible); width: 100%; }
textarea { min-height: 80px; resize: vertical; }
input[type="checkbox"] { width: 22px; height: 22px; min-height: 0; accent-color: var(--vert-fonce); }
label { display: block; font-size: .85rem; font-weight: 600; color: var(--texte-2); margin-bottom: 10px; }
label > input, label > select, label > textarea { margin-top: 4px; }
.champs { display: grid; gap: 0 12px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
fieldset { border: 1px solid var(--bord); border-radius: var(--rayon); margin: 0 0 12px; padding: 10px 12px 2px; }
fieldset[disabled] { opacity: .6; }
legend { font-weight: 700; padding: 0 6px; }

/* Fiche athlète */
.fiche h2 { margin-bottom: 2px; }
.objectif { font-weight: 700; color: var(--vert-fonce); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 12px; }
.kpi { background: var(--vert-clair); border-radius: 8px; padding: 8px 10px; }
.kpi b { display: block; font-size: 1.2rem; }
.kpi span { font-size: .8rem; color: var(--texte-2); }
.dispos { display: flex; gap: 4px; }
.dispos span { width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; border: 1px solid var(--bord); color: var(--texte-2); }
.dispos span.oui { background: var(--vert-fonce); border-color: var(--vert-fonce); color: var(--carte); }

/* Semaine */
.nav-semaine { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.nav-semaine h2 { margin: 0; flex: 1; text-align: center; min-width: 180px; }
.nav-semaine h2 small { display: block; font-size: .8rem; font-weight: 400; color: var(--texte-2); }
.ruban { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 0; justify-content: center; }
.ruban span { font-size: .78rem; font-weight: 700; letter-spacing: .04em; border-radius: 99px; padding: 3px 12px; background: var(--vert-clair); color: var(--sapin); }
.ruban span.cycle { background: transparent; border: 1px dashed var(--vert); }
.jours { display: grid; gap: 10px; }
.jour { background: var(--carte); border: 1px solid var(--bord); border-left: 5px solid var(--fam, var(--bord)); border-radius: var(--rayon); padding: 10px 12px; }
.jour.repos { background: var(--repos); }
.jour.auj { box-shadow: 0 0 0 2px var(--vert); }
.jour .tete { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.jour .date { font-weight: 700; min-width: 92px; }
.jour .corps { font-weight: 700; font-size: 1.02rem; }
.jour.repos .corps { font-weight: 500; color: var(--texte-2); }
.puces { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.puce { font-size: .78rem; border: 1px solid var(--bord); border-radius: 99px; padding: 2px 9px; background: var(--carte); white-space: nowrap; }
.puce.type { border-color: var(--fam, var(--bord)); font-weight: 700; }
.puce.type::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--fam, var(--bord)); margin-right: 5px; }
.consigne { margin-top: 6px; font-size: .88rem; color: var(--alerte); font-weight: 600; }
.reperes { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
.repere { font-size: .8rem; background: var(--vert-clair); border-radius: 6px; padding: 3px 8px; }
.repere b { color: var(--sapin); }
.retour { margin-top: 8px; border-top: 1px dashed var(--bord); padding-top: 8px; display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: center; font-size: .9rem; }
.retour .note { flex-basis: 100%; font-style: italic; color: var(--texte-2); white-space: pre-wrap; }
.rpe { display: inline-block; min-width: 26px; text-align: center; border-radius: 6px; padding: 0 6px; font-weight: 700; color: #000; background: var(--rpe, var(--dragon)); }
details.def { margin-top: 6px; font-size: .82rem; color: var(--texte-2); }
details.def summary { cursor: pointer; min-height: 28px; }
.bilan { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }

/* Tableaux */
.tableau { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { border-bottom: 1px solid var(--bord); padding: 6px 8px; text-align: left; vertical-align: top; }
th { background: var(--vert-clair); color: var(--sapin); font-weight: 700; position: sticky; top: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.cour td { background: var(--vert-clair); }
tbody tr.cliquable { cursor: pointer; }
tbody tr.cliquable:hover td { background: var(--vert-clair); }

/* Graphique */
.graph { position: relative; }
.graph svg { width: 100%; height: auto; display: block; }
.graph .axe { fill: var(--texte-2); font-size: 11px; }
.graph .grille { stroke: var(--bord); stroke-width: 1; }
.graph rect.barre { fill: var(--vert); cursor: pointer; }
.graph rect.barre.cour { fill: var(--sapin); }
.graph rect.cible { fill: transparent; cursor: pointer; }
.infobulle { position: absolute; pointer-events: none; background: var(--carte); border: 1px solid var(--bord); border-radius: 8px; padding: 6px 10px; font-size: .8rem; box-shadow: 0 4px 14px rgba(0,0,0,.12); white-space: nowrap; display: none; z-index: 5; }

/* Légende */
.fam { display: inline-block; width: 12px; height: 12px; border-radius: 3px; background: var(--fam); vertical-align: -1px; margin-right: 6px; }
dl.codes { display: grid; grid-template-columns: minmax(84px, max-content) 1fr; gap: 6px 14px; margin: 0; }
dl.codes dt { font-weight: 700; }
dl.codes dd { margin: 0; color: var(--texte-2); }
mark { background: #FDE68A; color: #000; }

/* Protos */
.proto h3 { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.proto .code { font-size: .8rem; background: var(--sapin); color: var(--fond); border-radius: 6px; padding: 2px 8px; }
.proto table td { border: 1px solid var(--bord); }

.alerte { background: var(--alerte-fond); border: 1px solid var(--alerte); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
.vide { text-align: center; padding: 30px 16px; }
.vide img { max-width: 240px; width: 70%; }

dialog { border: 0; border-radius: 14px; padding: 0; width: min(680px, calc(100vw - 24px)); max-height: calc(100vh - 32px); background: var(--carte); color: var(--texte); }
dialog::backdrop { background: rgba(5,25,20,.55); }
dialog form.boite { padding: 16px; }
dialog .pied { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; position: sticky; bottom: 0; background: var(--carte); padding-top: 10px; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 16px); background: var(--sapin); color: var(--fond); padding: 10px 16px; border-radius: 8px; display: none; z-index: 50; max-width: calc(100vw - 32px); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media print {
  nav.onglets, header.app select, .noprint, button { display: none !important; }
  body { background: #fff; padding: 0; }
  .carte, .jour { break-inside: avoid; }
}
</style>
</head>

<script id="core">
var Core = (function () {
  'use strict';
  var TZ = 'Europe/Paris';
  var SCHEMA_VERSION = 1;
  var JOURS = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
  var JOURS_LONGS = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
  // Colonnes « partie entraîneur » et « partie athlète » du tableau PLAN
  var CHAMPS_COACH = ['eveil', 'educ', 'corps', 'rac', 'profil', 'type', 'consignes'];
  var CHAMPS_ATHLETE = ['km', 'dureeSec', 'rpe', 'notes'];
  // Échelle « Intensité de l'effort » de 1 à 10 : image insérée dans l'onglet PLAN du classeur (cellule O7).
  // Libellés et couleurs relevés sur cette image ; les niveaux sans libellé restent sans libellé.
  var ECHELLE_RPE = { 1: 'Très facile', 2: 'Facile', 4: 'Modéré', 7: 'Difficile', 9: 'Très difficile', 10: 'Effort maximal' };
  var COULEURS_RPE = { 1: '#66CC00', 2: '#66CC44', 3: '#13BFF1', 4: '#5CADF6', 5: '#139AF2', 6: '#FEDF00', 7: '#FEC600', 8: '#FFA000', 9: '#FE4000', 10: '#FF0000' };
  // Libellé du niveau entier le plus proche (6,5 -> niveau 7) ; null hors échelle
  function libelleRPE(v) { if (!isNum(v) || v < 1 || v > 10) return null; var n = Math.round(v); return { niveau: n, libelle: ECHELLE_RPE[n] || '', couleur: COULEURS_RPE[n] }; }

  function pad2(n) { n = String(n); return n.length < 2 ? '0' + n : n; }
  function isNum(x) { return typeof x === 'number' && isFinite(x); }
  function texte(v) { return v == null ? '' : String(v).trim(); }

  /* ---------- Nombres (décimale à virgule) ---------- */
  function parseNumberFR(v) {
    if (v === null || v === undefined) return null;
    if (typeof v === 'number') return isFinite(v) ? v : NaN;
    var s = String(v).trim().replace(/[\s  ]/g, '');
    if (s === '') return null;
    if (!/^[+-]?(\d+([.,]\d*)?|[.,]\d+)$/.test(s)) return NaN;
    return Number(s.replace(',', '.'));
  }
  function nombreFR(x, d) {
    if (!isNum(x)) return '';
    var p = Math.pow(10, d == null ? 2 : d);
    return String(Math.round(x * p) / p).replace('.', ',');
  }

  /* ---------- Dates (AAAA-MM-JJ, calendrier Europe/Paris) ---------- */
  function isValidISODate(s) {
    if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    var p = s.split('-').map(Number);
    if (p[0] < 1900 || p[0] > 2100 || p[1] < 1 || p[1] > 12 || p[2] < 1) return false;
    return p[2] <= new Date(Date.UTC(p[0], p[1], 0)).getUTCDate();
  }
  // jj/mm/aaaa, jj/mm/aa (20aa) ou aaaa-mm-jj
  function parseDateFR(v) {
    var s = texte(v), m, iso;
    if ((m = /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4}|\d{2})$/.exec(s))) {
      var a = m[3].length === 2 ? '20' + m[3] : m[3];
      iso = a + '-' + pad2(m[2]) + '-' + pad2(m[1]);
    } else if (/^\d{4}-\d{2}-\d{2}$/.test(s)) iso = s;
    else return null;
    return isValidISODate(iso) ? iso : null;
  }
  function formatDateFR(iso, court) {
    if (!isValidISODate(iso)) return '';
    var p = iso.split('-');
    return court ? p[2] + '/' + p[1] : p[2] + '/' + p[1] + '/' + p[0];
  }
  function isoToUTC(iso) { var p = iso.split('-').map(Number); return Date.UTC(p[0], p[1] - 1, p[2]); }
  function utcToISO(t) { return new Date(t).toISOString().slice(0, 10); }
  function addDays(iso, n) { return utcToISO(isoToUTC(iso) + n * 86400000); }
  function daysBetween(a, b) { return Math.round((isoToUTC(b) - isoToUTC(a)) / 86400000); }
  function dayOfWeek(iso) { return (new Date(isoToUTC(iso)).getUTCDay() + 6) % 7; } // 0 = lundi
  function weekStart(iso) { return addDays(iso, -dayOfWeek(iso)); }
  function todayParis(now) {
    var o = {};
    new Intl.DateTimeFormat('en-GB', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' })
      .formatToParts(now || new Date()).forEach(function (p) { o[p.type] = p.value; });
    return o.year + '-' + o.month + '-' + o.day;
  }
  // Série Excel (système 1900) -> ISO. 61 = 01/03/1900 (Excel compte un faux 29/02/1900).
  function excelSerialToISO(n) {
    if (!isNum(n) || n < 1) return null;
    var j = Math.floor(n);
    if (j < 61) j += 1;
    return utcToISO(Date.UTC(1899, 11, 30) + j * 86400000);
  }

  /* ---------- Semaines du contrat ---------- */
  // Le contrat commence le lundi « debut » : semaine 1 = 7 premiers jours (S82 = lundi 03/08/2026 pour un début au 13/01/2025).
  function numSemaine(debut, iso) {
    if (!isValidISODate(debut) || !isValidISODate(iso)) return null;
    return Math.floor(daysBetween(weekStart(debut), iso) / 7) + 1;
  }
  function lundiSemaine(debut, n) { return addDays(weekStart(debut), (n - 1) * 7); }

  /* ---------- Durées et allures ---------- */
  function formatDuree(sec) {
    if (!isNum(sec)) return '';
    var t = Math.round(sec), h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    return h + ':' + pad2(m) + ':' + pad2(s);
  }
  // "1:15:45", "45:07" (mm:ss), "1h15", "1h15m45", "75" (minutes)
  function parseDuree(v) {
    var s = texte(v).toLowerCase().replace(/\s/g, ''), m;
    if (s === '') return null;
    if ((m = /^(\d+):([0-5]\d):([0-5]\d)$/.exec(s))) return +m[1] * 3600 + +m[2] * 60 + +m[3];
    if ((m = /^(\d+):([0-5]\d)$/.exec(s))) return +m[1] * 60 + +m[2];
    if ((m = /^(\d+)h([0-5]?\d)?(?:m(?:in)?)?([0-5]?\d)?s?$/.exec(s))) return +m[1] * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0);
    if ((m = /^(\d+)(?:mn|min|')?$/.exec(s))) return +m[1] * 60;
    return NaN;
  }
  // Temps court : < 2 min au dixième (« 36,7 s »), sinon m:ss
  function formatTemps(sec) {
    if (!isNum(sec)) return '';
    if (sec < 120) return nombreFR(Math.round(sec * 10) / 10, 1) + ' s';
    var t = Math.round(sec);
    if (t >= 3600) return formatDuree(t);
    return Math.floor(t / 60) + ':' + pad2(t % 60);
  }
  function paceFromSpeed(kmh) { return isNum(kmh) && kmh > 0 ? 3600 / kmh : null; }
  function formatAllure(secKm) {
    if (!isNum(secKm) || secKm <= 0) return '';
    var t = Math.round(secKm);
    return Math.floor(t / 60) + ':' + pad2(t % 60) + ' /km';

EN DESCENTE", "famille": "Fartlek"}, {"code": "COTE", "desc": "SEANCE SUR COTE 5-10% — TRAVAIL DE TECHNIQUE DE COURSE (FOULEE/PLACEMENT/BRAS)", "famille": "Côtes"}, {"code": "MONT", "desc": "SEANCE EN MONTEE SUR COTE DE 10-15% MAX — TRAVAIL DE RENFORCEMENT MUSCULAIRE (PUISSANCE) ET TECHNIQUE SPECIFIQUE (BÂTONS OU COTE AVEC MAINS SUR CUISSES)", "famille": "Côtes"}, {"code": "EXC", "desc": "TRAVAIL EXCENTRIQUE (DESCENTE) VIGILANCE SUR L'ECHAUFFEMENT EN PROGRESSIF ET PPS AVANT SEANCE", "famille": "Côtes"}, {"code": "CON/EXC", "desc": "TRAVAIL CONCENCTRIQUE (COTE) PUIS EXCENTRIQUE (DESCENTE)", "famille": "Côtes"}, {"code": "SPRINT", "desc": "SPRINT (COURT OU LONG) EN COTE", "famille": "Côtes"}, {"code": "NAV", "desc": "SEANCE EN NAVETTE - Trouver un spot spécifique (type côte …) et travailler en aller retour", "famille": "Côtes"}, {"code": "PYR", "desc": "SEANCE PYRAMIDALE - COTE/DESC/PLAT OU COTE/PLAT/DESC OU DESC/COTE/PLAT …", "famille": "Côtes"}, {"code": "MYO", "desc": "SEANCE MYO CROSS MAX - SOLLICITER DAVANTAGE LES FIBRES MUSCULAIRES", "famille": "Côtes"}, {"code": "SPE10", "desc": "ALLURE SPECFIQUE 10KM", "famille": "Spécifique / allures"}, {"code": "SPE1/2", "desc": "ALLURE SPECFIQUE SEMI MARATHON", "famille": "Spécifique / allures"}, {"code": "SPE MAR", "desc": "ALLURE SPECIFIQUE MARATHON", "famille": "Spécifique / allures"}, {"code": "SPE V", "desc": "ALLURE SPECIFIQUE AVEC VARIATIONS D'ALLURES", "famille": "Spécifique / allures"}, {"code": "PF", "desc": "SEANCE DE PRE-FATIGUE", "famille": "Spécifique / allures"}, {"code": "ALL V", "desc": "ALLURES VARIEES", "famille": "Spécifique / allures"}, {"code": "TEMPO", "desc": "TRAVAIL DE RYTHME SELON ZONE D'ALLURES", "famille": "Spécifique / allures"}, {"code": "SV", "desc": "SEANCE VARIEE", "famille": "Divers"}, {"code": "AUTO", "desc": "SEANCE D'AUTONOMIE — GESTION DES DIVERS CRITERES DE SEANCES (TERRAIN/ALLURES/DUREE D'EFFORT et RECUP…) SELON ENVIES ET SENSATIONS", "famille": "Divers"}, {"code": "RENFO", "desc": " <script>
/* ======================================================================
   STOCKAGE : un seul enregistrement « etat » dans IndexedDB
   (repli localStorage, puis mémoire). Les données restent sur l'appareil.
   ====================================================================== */
var Store = (function () {
  'use strict';
  var NOM = 'respir-outdoor', LS = 'respir-outdoor-v1', db = null, api = { mode: null };
  function ouvrir() {
    return new Promise(function (ok, ko) {
      if (!window.indexedDB) return ko(new Error('IndexedDB indisponible'));
      var r = indexedDB.open(NOM, 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
      r.onsuccess = function () { ok(r.result); };
      r.onerror = function () { ko(r.error); };
    });
  }
  api.charger = function () {
    return ouvrir().then(function (d) {
      db = d; api.mode = 'IndexedDB';
      return new Promise(function (ok, ko) { var q = db.transaction('kv').objectStore('kv').get('etat'); q.onsuccess = function () { ok(q.result || null); }; q.onerror = function () { ko(q.error); }; });
    }).catch(function () {
      try { api.mode = 'localStorage'; var b = localStorage.getItem(LS); return b ? JSON.parse(b) : null; }
      catch (e) { api.mode = 'mémoire (non enregistré)'; return null; }
    });
  };
  api.enregistrer = function (etat) {
    if (api.mode === 'IndexedDB') return new Promise(function (ok, ko) {
      var t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(JSON.parse(JSON.stringify(etat)), 'etat');
      t.oncomplete = function () { ok(); }; t.onerror = function () { ko(t.error); };
    });
    if (api.mode === 'localStorage') { try { localStorage.setItem(LS, JSON.stringify(etat)); } catch (e) { return Promise.reject(e); } }
    return Promise.resolve();
  };
  return api;
})();

/* ======================================================================
   APPLICATION
   ====================================================================== */
(function () {
  'use strict';
  var C = Core;
  var FAMILLES = {
    'Aérobie': '#3A8376', 'Récupérations': '#7AA59C', 'VMA': '#B5443A', 'Fartlek': '#C2702E', 'Côtes': '#8A5A2B',
    'Spécifique / allures': '#6B4FA0', 'Divers': '#5B6B73', 'Renfo': '#3D5A80', 'Respiration': '#4E8FB0', 'Compétition': '#0A322A'
  };
  var ROLES = { coach: 'Entraîneur', athlete: 'Athlète' };
  var E = { athletes: [], courant: null, legende: DEFAUTS.legende, protos: [], reglages: { role: 'coach' }, version: C.SCHEMA_VERSION };
  var vue = 'plan', semaineAffichee = null, rechercheLegende = '';
  var main = document.getElementById('contenu'), boite = document.getElementById('boite');

  /* ---------- Utilitaires ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(sel, el) { return (el || document).querySelector(sel); }
  function $$(sel, el) { return Array.prototype.slice.call((el || document).querySelectorAll(sel)); }
  function toast(t) { var x = $('#toast'); x.textContent = t; x.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { x.style.display = 'none'; }, 3500); }
  function auj() { return C.todayParis(); }
  function athlete() { return E.athletes.filter(function (a) { return a.id === E.courant; })[0] || null; }
  function estCoach() { return E.reglages.role === 'coach'; }
  function sauver() {
    return Store.enregistrer(E).catch(function (e) { toast('Enregistrement impossible : ' + e.message); });
  }
  function telecharger(nom, contenu, type) {
    var blob = new Blob([contenu], { type: type });
    var f = typeof File === 'function' ? new File([blob], nom, { type: type }) : null;
    // Partage natif sur mobile (mail, messagerie…) si disponible, sinon téléchargement
    if (f && navigator.canShare && navigator.canShare({ files: [f] }) && /Android|iPhone|iPad/i.test(navigator.userAgent)) {
      return navigator.share({ files: [f], title: nom }).catch(function () {});
    }
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nom;
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  function horodatage() { return auj().replace(/-/g, ''); }
  function nomComplet(a) { return [a.prenom, a.nom].filter(Boolean).join(' ') || 'Athlète sans nom'; }
  function famille(code) {
    if (C.normCode(code) === 'COMP' || C.normCode(code) === 'PROTO') return 'Compétition';
    var r = C.chercherCode(E.legende && E.legende.types, code);
    return r && r.entree.famille ? r.entree.famille : null;
  }
  function couleurFam(code) { var f = famille(code); return f ? FAMILLES[f] : null; }
  function minutes(v) { var t = C.texte(v); return /^\d+([.,]\d+)?$/.test(t) ? t + ' min' : t; }
  function badgeRPE(v) {
    var l = C.libelleRPE(v);
    return '<span class="rpe"' + (l ? ' style="--rpe:' + l.couleur + '"' : '') + '>' + C.nombreFR(v, 1) + '</span>' + (l && l.libelle ? ' <span class="petit muet">' + esc(l.libelle) + '</span>' : '');
  }
  function jourCourt(iso) { return C.JOURS_LONGS[C.dayOfWeek(iso)].slice(0, 3) + '. ' + C.formatDateFR(iso, true); }
  function semaineDe(a, iso) { return a.debut ? C.numSemaine(a.debut, iso) : null; }
  function lundiDe(a, n) { return C.lundiSemaine(a.debut, n); }

  /* ---------- Rendu général ---------- */
  function rendreEntete() {
    var s = $('#choixAthlete');
    s.innerHTML = E.athletes.length
      ? E.athletes.map(function (a) { return '<option value="' + esc(a.id) + '"' + (a.id === E.courant ? ' selected' : '') + '>' + esc(nomComplet(a)) + '</option>'; }).join('')
      : '<option value="">Aucun athlète</option>';
    $('#badgeRole').textContent = 'Mode ' + ROLES[E.reglages.role].toLowerCase();
  }
  function rendre() {
    rendreEntete();
    $$('nav.onglets a').forEach(function (a) { if (a.dataset.v === vue) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    ({ plan: vuePlan, legende: vueLegende, allures: vueAllures, protos: vueProtos, donnees: vueDonnees, tests: vueTests }[vue] || vuePlan)();
  }
  function route() {
    var h = (location.hash || '#/plan').slice(2).split('/');
    vue = h[0] || 'plan';
    rendre();
  }

  function vueVide() {
    return '<div class="carte vide"><img src="' + $('header.app img').src + '" alt=""><h2>Bienvenue</h2>' +
      '<p class="muet">Importe le classeur Excel de l\'entraîneur (onglets PLAN, LEGENDE, ALLURES, PROTOS) ou crée un athlète.</p>' +
      '<div class="ligne" style="justify-content:center"><button data-act="importXlsx">Importer un classeur Excel</button>' +
      '<button class="sec" data-act="importJson">Ouvrir un fichier d\'échange</button><button class="sec" data-act="nouvelAthlete">Créer un athlète</button></div></div>';
  }

  /* ---------- PLAN ---------- */
  function vuePlan() {
    var a = athlete();
    if (!a) { main.innerHTML = vueVide(); return; }
    var aj = auj();
    if (!a.debut) a.debut = C.weekStart(aj);
    if (semaineAffichee === null) semaineAffichee = Math.max(1, semaineDe(a, aj));
    var n = semaineAffichee, lundi = lundiDe(a, n), dim = C.addDays(lundi, 6);
    var sNow = semaineDe(a, aj), compet = C.prochaineCompet(a, aj), info = a.semaines[n] || {};
    var jours = C.joursSemaine(a, lundi), bil = C.bilanJours(jours.map(function (x) { return x.jour; }));
    var dispo = [['L', 'L'], ['M1', 'M'], ['M2', 'M'], ['J', 'J'], ['V', 'V'], ['S', 'S'], ['D', 'D']];
    var h = '';
    h += '<section class="carte fiche"><div class="ligne"><div class="espace"><h2>' + esc(nomComplet(a)) + '</h2>' +
      (a.objectif ? '<div class="objectif">' + esc(a.objectif) + '</div>' : '') +
      (a.objectif2 ? '<div class="muet petit">' + esc(a.objectif2) + '</div>' : '') + '</div>' +
      (estCoach() ? '<button class="sec noprint" data-act="ficheAthlete">Modifier la fiche</button>' : '') + '</div>' +
      '<div class="kpis">' +
      '<div class="kpi"><b>' + (sNow ? 'S' + sNow : '—') + (a.contratSemaines ? ' / ' + a.contratSemaines : '') + '</b><span>Semaine du contrat' + (a.fin ? ' (fin ' + C.formatDateFR(a.fin) + ')' : '') + '</span></div>' +
      '<div class="kpi"><b>' + (C.isNum(a.vma) ? C.nombreFR(a.vma) + ' km/h' : '—') + '</b><span>VMA de référence</span></div>' +
      '<div class="kpi"><b>' + esc(a.hebdo || '—') + '</b><span>Séances par semaine</span></div>' +
      '<div class="kpi"><b>' + (compet ? (compet.dans === 0 ? 'Aujourd\'hui' : 'J-' + compet.dans) : '—') + '</b><span>' + (compet ? esc(compet.jour.corps) + ' · ' + C.formatDateFR(compet.date) : 'Prochaine compétition') + '</span></div>' +
      '</div>' +
      '<div class="ligne petit muet" style="margin-top:10px"><span>Dispos :</span><span class="dispos">' + dispo.map(function (d) { return '<span class="' + (a.dispos[d[0]] ? 'oui' : '') + '" title="' + C.JOURS_LONGS[dispo.indexOf(d)] + (a.dispos[d[0]] ? ' : disponible' : ' : non') + '">' + d[1] + '</span>'; }).join('') + '</span>' +
      (a.contraintes ? '<span>· Contraintes : ' + esc(a.contraintes) + '</span>' : '') + (a.terrains ? '<span>· Terrains : ' + esc(a.terrains) + '</span>' : '') + '</div>' +
      '</section>';

    h += '<section class="carte"><div class="nav-semaine">' +
      '<button class="sec" data-act="semPrec" aria-label="Semaine précédente">◀</button>' +
      '<h2>S' + n + '<small>du ' + C.formatDateFR(lundi) + ' au ' + C.formatDateFR(dim) + '</small></h2>' +
      '<button class="sec" data-act="semSuiv" aria-label="Semaine suivante">▶</button></div>' +
      '<div class="ligne noprint" style="justify-content:center;margin-top:8px">' +
      '<button class="discret" data-act="semAuj">Cette semaine</button>' +
      '<button class="discret" data-act="imprimer">Imprimer</button>' +
      (estCoach() ? '<button class="discret" data-act="semInfo">Cycle / phase</button><button class="discret" data-act="semCopier">Copier vers…</button>' : '') + '</div>' +
      ((info.phase || info.cycle) ? '<div class="ruban">' + (info.phase ? '<span title="Situation planif">' + esc(info.phase) + '</span>' : '') + (info.cycle ? '<span class="cycle" title="Type de cycle">' + esc(info.cycle) + '</span>' : '') + '</div>' : '') +
      '</section>';

    h += '<section class="jours" aria-label="Séances de la semaine">' + jours.map(function (x) { return carteJour(a, x.date, x.jour, aj); }).join('') + '</section>';

    h += '<section class="carte" style="margin-top:14px"><h3>Bilan S' + n + '</h3><div class="bilan">' +
      '<div class="kpi"><b>' + C.nombreFR(bil.km, 2) + ' km</b><span>KM hebdo</span></div>' +
      '<div class="kpi"><b>' + (bil.dureeSec ? C.formatDuree(bil.dureeSec) : '—') + '</b><span>Durée</span></div>' +
      '<div class="kpi"><b>' + (bil.rpeMoy !== null ? C.nombreFR(bil.rpeMoy, 1) : '—') + '</b><span>RPE moyen' + (bil.nbRpe ? ' (' + bil.nbRpe + ' séance' + (bil.nbRpe > 1 ? 's' : '') + ')' : '') + '</span></div>' +
      '<div class="kpi"><b>' + bil.faites + ' / ' + bil.prevues + '</b><span>Séances renseignées / prévues</span></div>' +
      '</div></section>';

    h += vueEnsemble(a, n);
    main.innerHTML = h;
    brancherGraph(a);
  }

  function carteJour(a, date, j, aj) {
    var repos = C.estRepos(j), vide = !C.aContenuCoach(j), coul = couleurFam(j.type);
    var lp = C.chercherCode(E.legende && E.legende.profils, j.profil), lt = C.chercherCode(E.legende && E.legende.types, j.type);
    var rep = C.reperesSeance(j, { vma: a.vma, zones: a.zones, allures: a.allures });
    var allure = C.allureMoyenne(j.dureeSec, j.km);
    var h = '<article class="jour' + (repos || vide ? ' repos' : '') + (date === aj ? ' auj' : '') + '"' + (coul ? ' style="--fam:' + coul + '"' : '') + '>';
    h += '<div class="tete"><span class="date">' + jourCourt(date) + '</span><span class="corps">' + (vide ? '<span class="muet">—</span>' : esc(j.corps || '')) + '</span></div>';
    var puces = [];
    if (j.eveil) puces.push('<span class="puce" title="Échauffement / éveil musculaire">Éveil ' + esc(minutes(j.eveil)) + '</span>');
    if (j.educ) puces.push('<span class="puce" title="Éducatifs / gammes athlétiques">Éduc ' + esc(minutes(j.educ)) + '</span>');
    if (j.rac) puces.push('<span class="puce" title="Retour au calme">RAC ' + esc(minutes(j.rac)) + '</span>');
    if (j.profil) puces.push('<span class="puce" title="Profil">' + esc(j.profil) + '</span>');
    if (j.type) puces.push('<span class="puce type" title="Type' + (famille(j.type) ? ' · ' + esc(famille(j.type)) : '') + '">' + esc(j.type) + '</span>');
    if (puces.length) h += '<div class="puces">' + puces.join('') + '</div>';
    if (j.consignes) h += '<div class="consigne">⚑ ' + esc(j.consignes) + '</div>';
    if (rep.length) h += '<div class="reperes">' + rep.map(function (r) { return '<span class="repere"><b>' + esc(r.libelle) + '</b> · ' + esc(r.detail) + '</span>'; }).join('') + '</div>';
    if (lp || lt) {
      h += '<details class="def"><summary>Définitions</summary>' +
        (lt ? '<div><b>' + esc(lt.entree.code) + '</b>' + (lt.variante ? ' (variante « ' + esc(j.type) + ' »)' : '') + ' : ' + esc(lt.entree.desc) + '</div>' : '') +
        (lp ? '<div><b>' + esc(lp.entree.code) + '</b> : ' + esc(lp.entree.desc) + '</div>' : '') + '</details>';
    }
    var aRet = C.aRetour(j);
    if (aRet || (!repos && !vide)) {
      h += '<div class="retour">';
      if (aRet) {
        h += (C.isNum(j.km) ? '<span><b>' + C.nombreFR(j.km, 2) + '</b> km</span>' : '') +
          (C.isNum(j.dureeSec) ? '<span><b>' + C.formatDuree(j.dureeSec) + '</b></span>' : '') +
          (allure ? '<span>' + C.formatAllure(allure) + '</span>' : '') +
          (C.isNum(j.rpe) ? '<span>RPE ' + badgeRPE(j.rpe) + '</span>' : '');
      } else h += '<span class="muet petit">Pas encore de retour</span>';
      h += '<span class="espace"></span>';
      h += '<button class="discret noprint" data-act="editJour" data-date="' + date + '">' + (estCoach() ? 'Modifier' : (aRet ? 'Modifier mon retour' : 'Saisir mon retour')) + '</button>';
      if (j.notes) h += '<div class="note">« ' + esc(j.notes) + ' »</div>';
      h += '</div>';

  // Vue d'ensemble : km par semaine (graphique + tableau)
  function semainesAvecDonnees(a) {
    var dates = Object.keys(a.jours).sort();
    if (!dates.length) return [];
    var s1 = semaineDe(a, dates[0]), s2 = semaineDe(a, dates[dates.length - 1]), out = [];
    for (var s = s1; s <= s2; s++) {
      var l = lundiDe(a, s), jr = C.joursSemaine(a, l).map(function (x) { return x.jour; });
      var b = C.bilanJours(jr);
      b.n = s; b.lundi = l; b.info = a.semaines[s] || {};
      b.compet = jr.filter(function (j) { return C.normCode(j.type) === 'COMP'; }).map(function (j) { return j.corps; });
      out.push(b);
    }
    return out;
  }
  function vueEnsemble(a, n) {
    var sem = semainesAvecDonnees(a);
    if (!sem.length) return '';
    var h = '<section class="carte noprint"><h3>KM réalisés par semaine</h3>' +
      '<p class="muet petit">Somme des km saisis dans la partie athlète. Touchez une barre pour ouvrir la semaine.</p>' +
      '<div class="graph" id="graph"></div>' +

      sem.map(function (b) {
        return '<tr class="cliquable' + (b.n === n ? ' cour' : '') + '" data-act="allerSem" data-n="' + b.n + '"><td>S' + b.n + '</td><td>' + C.formatDateFR(b.lundi) + '</td><td>' + esc([b.info.phase, b.info.cycle].filter(Boolean).join(' · ')) + '</td>' +
          '<td class="num">' + b.prevues + '</td><td class="num">' + (b.km ? C.nombreFR(b.km, 2) : '') + '</td><td class="num">' + (b.dureeSec ? C.formatDuree(b.dureeSec) : '') + '</td>' +
          '<td class="num">' + (b.rpeMoy !== null ? C.nombreFR(b.rpeMoy, 1) : '') + '</td><td>' + esc(b.compet.join(', ')) + '</td></tr>';
      }).join('') + '</tbody></table></div></details></section>';
    return h;
  }
  function brancherGraph(a) {
    var zone = $('#graph');
    if (!zone) return;
    var sem = semainesAvecDonnees(a), W = Math.max(320, zone.clientWidth || 600), H = 200, g = 34, d = 10, hh = 18, bas = 24;
    var max = Math.max.apply(null, sem.map(function (b) { return b.km; }).concat([10]));
    var pas = max > 60 ? 20 : 10, top = Math.ceil(max / pas) * pas, lw = (W - g - d) / sem.length, bw = Math.max(2, Math.min(28, lw - 2));
    var y = function (v) { return H - bas - (H - bas - hh) * v / top; };
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Kilomètres réalisés par semaine, de S' + sem[0].n + ' à S' + sem[sem.length - 1].n + '">';
    for (var v = 0; v <= top; v += pas) s += '<line class="grille" x1="' + g + '" x2="' + (W - d) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text class="axe" x="' + (g - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '</text>';
    var pasLab = Math.ceil(sem.length / 8);
    sem.forEach(function (b, i) {
      var x = g + i * lw + (lw - bw) / 2, yy = y(b.km), hb = H - bas - yy;
      if (b.km > 0) {
        var r = Math.min(4, bw / 2, hb);
        s += '<path class="barre' + (b.n === semaineAffichee ? ' cour' : '') + '" fill="' + (b.n === semaineAffichee ? 'var(--sapin)' : 'var(--vert)') + '" d="M' + x + ' ' + (H - bas) + 'V' + (yy + r) + 'Q' + x + ' ' + yy + ' ' + (x + r) + ' ' + yy + 'H' + (x + bw - r) + 'Q' + (x + bw) + ' ' + yy + ' ' + (x + bw) + ' ' + (yy + r) + 'V' + (H - bas) + 'Z"/>';
      }
      s += '<rect class="cible" data-i="' + i + '" x="' + (g + i * lw) + '" y="' + hh + '" width="' + lw + '" height="' + (H - bas - hh) + '" tabindex="0" aria-label="S' + b.n + ' : ' + C.nombreFR(b.km, 1) + ' km"/>';
      if (i % pasLab === 0) s += '<text class="axe" x="' + (g + i * lw + lw / 2) + '" y="' + (H - 6) + '" text-anchor="middle">S' + b.n + '</text>';
    });
    s += '<line x1="' + g + '" x2="' + (W - d) + '" y1="' + (H - bas) + '" y2="' + (H - bas) + '" stroke="var(--texte-2)"/></svg><div class="infobulle" role="tooltip"></div>';
    zone.innerHTML = s;
    var bulle = $('.infobulle', zone);
    function montrer(e) {
      var i = +e.target.dataset.i, b = sem[i]; if (!b) return;
      bulle.innerHTML = '<b>S' + b.n + '</b> · ' + C.formatDateFR(b.lundi) + '<br>' + C.nombreFR(b.km, 2) + ' km' + (b.dureeSec ? ' · ' + C.formatDuree(b.dureeSec) : '') + (b.rpeMoy !== null ? ' · RPE ' + C.nombreFR(b.rpeMoy, 1) : '') + (b.info.phase ? '<br>' + esc(b.info.phase) : '');
      bulle.style.display = 'block';
      var rz = zone.getBoundingClientRect(), rr = e.target.getBoundingClientRect();
      var left = rr.left - rz.left + rr.width / 2 - bulle.offsetWidth / 2;
      bulle.style.left = Math.max(0, Math.min(rz.width - bulle.offsetWidth, left)) + 'px';
      bulle.style.top = '0px';
    }
    $$('rect.cible', zone).forEach(function (r) {
      r.addEventListener('mouseenter', montrer); r.addEventListener('focus', montrer);
      r.addEventListener('mouseleave', function () { bulle.style.display = 'none'; }); r.addEventListener('blur', function () { bulle.style.display = 'none'; });
      r.addEventListener('click', function () { semaineAffichee = sem[+r.dataset.i].n; vuePlan(); window.scrollTo(0, 0); });
      r.addEventListener('keydown', function (e) { if (e.key === 'Enter') r.dispatchEvent(new Event('click')); });
    });
  }

  /* ---------- Saisie d'un jour ---------- */

  function editJour(date) {

  function demanderMode(titre, texte, options) {

        '<div class="pied"><button type="button" class="sec" data-x="annuler">Annuler</button><button>Valider</button></div></form>';
      boite.showModal();

  var MODES = [
    ['plan', 'Mettre à jour le plan', 'Prend la partie entraîneur du fichier (séances, fiche, cycles) et garde les retours déjà saisis sur cet appareil.'],
    ['retours', 'Récupérer les retours de l\'athlète', 'Prend km, durée, RPE et notes du fichier et garde le plan de cet appareil.'],
    ['remplacer', 'Tout remplacer', 'Remplace l\'athlète de cet appareil par celui du fichier.']
  ];
  function integrerAthlete(recu, rapport, lg, protos) {
    var local = E.athletes.filter(function (x) { return x.id === recu.id; })[0];
    var defaut = estCoach() ? 'retours' : 'plan';
    var opts = MODES.slice().sort(function (x, y) { return (y[0] === defaut) - (x[0] === defaut); });
    var p = local
      ? demanderMode('Importer ' + nomComplet(recu), '<p>' + esc(nomComplet(recu)) + ' existe déjà sur cet appareil.</p>' + (rapport || ''), opts)
      : demanderMode('Importer ' + nomComplet(recu), (rapport || '') + '<p>Nouvel athlète.</p>', [['remplacer', 'Ajouter cet athlète', 'Crée l\'athlète sur cet appareil.']]);
    return p.then(function (mode) {
      if (!mode) return;
      var res = C.fusionner(local, recu, mode);
      res.maj = new Date().toISOString();
      if (local) E.athletes[E.athletes.indexOf(local)] = res; else E.athletes.push(res);
      E.courant = res.id; semaineAffichee = null;
      if (lg && (mode !== 'retours' || !local)) E.legende = lg;
      if (protos && protos.length && (mode !== 'retours' || !local)) E.protos = protos;
      return sauver().then(function () { toast('Import terminé'); location.hash = '#/plan'; rendre(); });
    });

    dates.forEach(function (d) {
      var j = a.jours[d], s = semaineDe(a, d), w = a.semaines[s] || {};
      l.push(['S' + s, C.JOURS[C.dayOfWeek(d)], C.formatDateFR(d), j.eveil || '', j.educ || '', j.corps || '', j.rac || '', j.profil || '', j.type || '', w.phase || '', w.cycle || '', j.consignes || '',
        C.isNum(j.km) ? C.nombreFR(j.km, 3) : '', C.isNum(j.dureeSec) ? C.formatDuree(j.dureeSec) : '', C.isNum(j.rpe) ? C.nombreFR(j.rpe, 1) : '', j.notes || '']);
    });
    telecharger(horodatage() + '_PLAN_' + (a.nom || '').toUpperCase() + '.csv', '﻿' + C.versCSV(l), 'text/csv;charset=utf-8');
  }

  /* ---------- Autotests ---------- */
  function vueTests() {
    var r = C.runTests(), ko = r.filter(function (x) { return !x.ok; }).length;
    var h = '<section class="carte"><h2>Autotests : ' + (r.length - ko) + ' / ' + r.length + ' réussis</h2><p class="muet petit">Valeurs de référence calculées à la main (voir FORMULES.md). Aucun test n\'utilise de données personnelles.</p><ul>' +
      r.map(function (x) { return '<li>' + (x.ok ? '✓' : '<b style="color:var(--alerte)">✗ ÉCHEC</b>') + ' ' + esc(x.nom) + (x.err ? ' — ' + esc(x.err) : '') + '</li>'; }).join('') + '</ul></section>';
    var a = athlete();
    if (a) {
      // Cohérence sur les données : bilan de chaque semaine = somme directe des jours
      var sem = semainesAvecDonnees(a), ecarts = 0, total = 0;
      sem.forEach(function (b) { var s = 0; for (var i = 0; i < 7; i++) { var j = a.jours[C.addDays(b.lundi, i)]; if (j && C.isNum(j.km)) s += j.km; } total += s; if (Math.abs(s - b.km) > 1e-6) ecarts++; });
      h += '<section class="carte"><h3>Cohérence sur les données de ' + esc(nomComplet(a)) + '</h3><p>' + (ecarts ? '✗ ' + ecarts + ' semaine(s) incohérente(s)' : '✓ Les ' + sem.length + ' bilans hebdomadaires égalent la somme directe des séances (' + C.nombreFR(total, 2) + ' km au total).') + '</p></section>';
    }
    main.innerHTML = h;
  }

  /* ---------- Actions ---------- */
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-act]');
    if (!b) return;
    var act = b.dataset.act, a = athlete();
    if (act === 'semPrec') { semaineAffichee = Math.max(1, semaineAffichee - 1); vuePlan(); }
    else if (act === 'semSuiv') { semaineAffichee++; vuePlan(); }
    else if (act === 'semAuj') { semaineAffichee = Math.max(1, semaineDe(a, auj())); vuePlan(); }
    else if (act === 'allerSem') { semaineAffichee = +b.dataset.n; vuePlan(); window.scrollTo(0, 0); }
    else if (act === 'imprimer') window.print();
    else if (act === 'semInfo') semInfo();
    else if (act === 'semCopier') semCopier();
    else if (act === 'editJour') editJour(b.dataset.date);
    else if (act === 'ficheAthlete') ficheAthlete(false);
    else if (act === 'nouvelAthlete') ficheAthlete(true);
    else if (act === 'editProto') editProto(+b.dataset.i);
    else if (act === 'importXlsx') importXlsx();
    else if (act === 'importJson') importJson();
    else if (act === 'exportAthlete') exportAthlete();
    else if (act === 'exportCsv') exportCsv();
    else if (act === 'sauvegarde') telecharger(horodatage() + '_RESPIR_SAUVEGARDE.json', JSON.stringify({ format: 'respir-sauvegarde', version: C.SCHEMA_VERSION, date: new Date().toISOString(), etat: E }), 'application/json');
    else if (act === 'supprVma') { if (confirm('Supprimer ce test ?')) { a.historiqueVMA.splice(+b.dataset.i, 1); sauver().then(vueAllures); } }
    else if (act === 'supprAthlete') {
      if (confirm('Supprimer ' + nomComplet(a) + ' et tout son plan de cet appareil ?')) {
        E.athletes = E.athletes.filter(function (x) { return x !== a; }); E.courant = E.athletes[0] ? E.athletes[0].id : null; semaineAffichee = null; sauver().then(rendre);
      }
    }
    else if (act === 'toutEffacer') {
      if (confirm('Effacer tous les athlètes, la légende et les protos de cet appareil ? Pense à faire une sauvegarde avant.')) {
        E.athletes = []; E.courant = null; E.legende = DEFAUTS.legende; E.protos = []; semaineAffichee = null; sauver().then(rendre);
      }
    }
  });
  $('#choixAthlete').onchange = function (e) { E.courant = e.target.value; semaineAffichee = null; sauver(); rendre(); };
  window.addEventListener('hashchange', route);

  Store.charger().then(function (d) {
    if (d && d.athletes) {
      E = Object.assign(E, d);
      E.reglages = Object.assign({ role: 'coach' }, d.reglages);
    }
    appliquerTheme();
    route();
  });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
