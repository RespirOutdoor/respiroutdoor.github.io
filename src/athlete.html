<div id="ouverture" aria-hidden="true">
  <div class="ouv-logo"><img alt=""></div>
</div>
<script>
// Animation d'ouverture (2 s) : touche l'écran pour la passer
(function () {
  var o = document.getElementById('ouverture'), l = document.querySelector('header.app img');
  if (l) o.querySelector('img').src = l.src;
  var duree = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches ? 600 : 2000;
  function fin() { if (o.parentNode) o.parentNode.removeChild(o); }
  o.addEventListener('click', fin);
  setTimeout(fin, duree);
})();
</script>
<main id="contenu" tabindex="-1"></main>

<div id="toast" role="status" aria-live="polite"></div>
