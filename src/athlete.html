<div id="ouverture" class="battement" aria-hidden="true">
  <div class="ouv-centre">
    <div class="ouv-logo"><img src="__LOGO_BLANC__" alt=""></div>
    <svg class="ouv-ecg" viewBox="0 0 540 120" preserveAspectRatio="none"><path pathLength="1" d="M-20 60 H150 L165 60 L178 20 L192 104 L206 6 L220 60 H262 L274 34 L286 92 L298 14 L310 60 H560"/></svg>
    <p class="ouv-myr"><span>My </span><b>RespiR</b></p>
    <p class="ouv-bonjour" id="ouvBonjour">Bonjour ! 👋</p>
    <p class="ouv-pret">Prêt(e) pour ta séance ? <span>♥</span></p>
  </div>
</div>
<script>
// Animation d'ouverture « Battement » (5 s) : une ligne de cardio traverse l'écran, le logo pulse à chaque battement,
// puis « My RespiR », « Bonjour <prénom> ! » et « Prêt(e) pour ta séance ? », fondu sur l'application ;
// touche l'écran pour la passer ; rien ne s'affiche si le téléphone demande de réduire les animations
(function () {
  var o = document.getElementById('ouverture');
  function fin() { if (o.parentNode) o.parentNode.removeChild(o); }
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) { fin(); return; }
  o.addEventListener('click', fin);
  setTimeout(fin, 5000);
  // Prénom : celui du lien personnel (#RespirOutdoor-Prénom-Nom-CODE), sinon celui enregistré sur le téléphone
  function afficher(p) { p = String(p || '').trim(); if (p) document.getElementById('ouvBonjour').textContent = 'Bonjour ' + p.charAt(0).toUpperCase() + p.slice(1).toLowerCase() + ' ! 👋'; }
  var h = decodeURIComponent(location.hash.slice(1)).split('-');
  if (/^respiroutdoor$/i.test(h[0]) && h.length >= 4) afficher(h[1]);
  else try {
    var r = indexedDB.open('my-respiroutdoor', 1);
    r.onupgradeneeded = function () { r.transaction.abort(); };
    r.onsuccess = function () { try { var q = r.result.transaction('kv').objectStore('kv').get('etat'); q.onsuccess = function () { var e = q.result; afficher(e && e.athlete && e.athlete.prenom); r.result.close(); }; } catch (e) {} };
  } catch (e) {}
})();
</script>
